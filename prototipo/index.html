<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>body{margin:0}[hidden]{display:none!important}</style>
<title>Nave AION</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&family=Manrope:wght@400;500;600&display=swap">
<style>
/* Layout: cena 3D em tela cheia (ponte de comando), HUD em vidro por cima: barra no topo, cartão ativo à direita (ou embaixo no celular), legenda e doca no rodapé. */
:root{
  color-scheme:dark;
  --void:#03050c;
  --ink:#e8f5ff;
  --ink-dim:#93b3cc;
  --holo:#4fd8ff;
  --holo-deep:#1b6cff;
  --ember:#ffb573;
  --glass:rgba(5,13,27,.86);
  --line:rgba(79,216,255,.34);
  --f-display:"Chakra Petch","Segoe UI",system-ui,sans-serif;
  --f-body:"Manrope","Segoe UI",system-ui,sans-serif;
}
html,body{height:100%}
body{background:var(--void);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow:hidden}
body.nogl{background:radial-gradient(120% 90% at 70% 80%,#3a1d2a 0%,#0a1230 38%,var(--void) 75%)}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:12px;pointer-events:none;
  padding-top:calc(14px + env(safe-area-inset-top,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;font-family:var(--f-display);text-shadow:0 0 12px rgba(3,5,12,.9)}
.brand{display:grid;gap:2px}
.brand b{font-size:22px;font-weight:600;letter-spacing:.42em;color:var(--ink)}
.brand span,.clock span{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--ink-dim)}
.clock{display:grid;gap:2px;justify-items:end;text-align:right}
.clock b{font-size:22px;font-weight:500;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.tag{font-family:var(--f-display);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ember);border:1px solid rgba(255,181,115,.5);padding:2px 7px;white-space:nowrap}
.zone{display:flex;align-items:center;justify-content:flex-end;min-height:0;min-width:0;padding-right:3vw}
.card{width:min(430px,100%);max-height:100%;display:flex;pointer-events:auto;padding:1px;background:linear-gradient(160deg,var(--holo),rgba(27,108,255,.25) 45%,var(--line));
  clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);
  transition:opacity .45s ease,transform .45s ease}
.card[hidden]{display:none}
.card.out{opacity:0;transform:translateY(14px) scale(.98)}
.card-in{flex:1;min-width:0;overflow:auto;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);padding:18px 18px 20px;display:grid;gap:14px;align-content:start;
  clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px)}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card-head h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--holo)}
.card h3{margin:0;font-family:var(--f-display);font-weight:500;font-size:19px;line-height:1.25;text-wrap:balance}
.card p{margin:0;color:var(--ink-dim)}
.cities{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.city{display:grid;gap:2px;padding:10px 8px;background:rgba(79,216,255,.07);border-top:1px solid var(--line);min-width:0}
.city small{font-family:var(--f-display);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);overflow-wrap:anywhere}
.city b{font-family:var(--f-display);font-weight:500;font-size:28px;font-variant-numeric:tabular-nums}
.city span{font-size:12px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
.city i{font-style:normal;color:var(--holo)}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.week div{display:grid;gap:3px;justify-items:center;font-size:11px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
.week b{font-weight:600;color:var(--ink);font-size:12px}
.week svg{width:18px;height:18px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{display:grid;gap:2px;padding:10px;background:rgba(79,216,255,.07);border-top:1px solid var(--line)}
.stat small{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-dim)}
.stat b{font-family:var(--f-display);font-weight:500;font-size:22px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--holo)}
.shot{aspect-ratio:16/9;max-width:100%;display:grid;place-items:center;background:linear-gradient(135deg,#0d2a55,#3a1d4f 60%,#5a2a2a);border:1px solid var(--line);font-family:var(--f-display);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:rgba(232,245,255,.7)}
.src{font-size:12px;color:var(--ink-dim)}
.rows{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.rows li{display:grid;gap:2px;padding-left:12px;border-left:1px solid var(--line)}
.rows b{font-family:var(--f-display);font-weight:500;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--holo)}
.rows span{color:var(--ink)}
.chain{display:grid;gap:9px;margin:0;padding:0;list-style:none;counter-reset:c}
.chain li{counter-increment:c;display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px}
.chain li::before{content:counter(c);font-family:var(--f-display);font-size:12px;color:var(--holo);border:1px solid var(--line);width:22px;height:22px;display:grid;place-items:center}
.chain b{font-weight:600;color:var(--ink)}
.chain span{display:block;color:var(--ink-dim);font-size:13.5px}
.deck{display:grid;gap:12px;justify-items:center;min-width:0}
.caption{max-width:62ch;margin:0;padding:6px 14px;background:rgba(3,5,12,.6);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);text-align:center;font-size:17px;font-weight:500;text-wrap:balance;text-shadow:0 0 14px rgba(3,5,12,1),0 0 4px rgba(3,5,12,1)}
.caption em{font-style:normal;color:var(--holo)}
.controls{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;pointer-events:auto}
.btn{font-family:var(--f-display);font-size:13px;font-weight:600;letter-spacing:.2em;text-transform:uppercase;color:var(--void);background:var(--holo);border:0;padding:12px 22px;cursor:pointer;
  clip-path:polygon(10px 0,100% 0,100% calc(100% - 10px),calc(100% - 10px) 100%,0 100%,0 10px);transition:filter .2s,transform .2s}
.btn:hover{filter:brightness(1.15)}
.btn:active{transform:translateY(1px)}
.btn:focus-visible,.chip:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.btn[hidden]{display:none}
.dock{display:flex;gap:8px;max-width:100%;overflow-x:auto;pointer-events:auto;padding-bottom:2px;scrollbar-width:none}
.dock::-webkit-scrollbar{display:none}
.chip{flex:none;font-family:var(--f-display);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink);background:rgba(6,16,32,.7);border:1px solid var(--line);padding:7px 11px;cursor:pointer;animation:chipin .5s ease both}
.chip[aria-pressed="true"]{border-color:var(--holo);color:var(--holo)}
@keyframes chipin{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:none}}
@media (max-aspect-ratio:1/1),(max-width:720px){
  .zone{align-items:flex-end;justify-content:center;padding-right:0}
  .card{width:min(460px,100%);max-height:62%}
  .brand b,.clock b{font-size:18px}
  .caption{font-size:15px}
}
@media (max-height:520px){.caption{font-size:14px}.card-in{padding:12px 14px;gap:10px}}
@media (prefers-reduced-motion:reduce){.card,.chip,.btn{transition:none;animation:none}}
</style>
</head>
<body>

<canvas id="stage" aria-hidden="true"></canvas>

<div class="hud">
  <header class="top">
    <div class="brand"><b>AION</b><span>Ponte de comando</span></div>
    <div class="clock"><b id="clk">--:--</b><span id="dat"></span><span class="tag">Protótipo visual</span></div>
  </header>

  <main class="zone">
    <article class="card out" id="card" hidden aria-live="polite"><div class="card-in" id="cardIn"></div></article>
  </main>

  <footer class="deck">
    <p class="caption" id="cap">AION em espera. <em>Toque para acordar a nave.</em></p>
    <div class="controls"><button class="btn" id="go" type="button">Iniciar briefing</button></div>
    <nav class="dock" id="dock" aria-label="Seções do briefing"></nav>
  </footer>
</div>

<template id="t-clima">
  <div class="card-head"><h2>Clima</h2><span class="tag">Exemplo</span></div>
  <div class="cities">
    <div class="city"><small>Santo André</small><b>24°</b><span>17° / 26°</span><span><i>☂</i> 30%</span></div>
    <div class="city"><small>São Bernardo</small><b>23°</b><span>16° / 25°</span><span><i>☂</i> 35%</span></div>
    <div class="city"><small>Mauá</small><b>24°</b><span>17° / 26°</span><span><i>☂</i> 30%</span></div>
  </div>
  <div class="week" id="week"></div>
</template>

<template id="t-velt">
  <div class="card-head"><h2>Anúncios VELT</h2><span class="tag">Exemplo</span></div>
  <div class="stats">
    <div class="stat"><small>Investido ontem</small><b>R$ 84,20</b><span>dentro do orçamento</span></div>
    <div class="stat"><small>Alcance</small><b>12.480</b><span>+8% na semana</span></div>
    <div class="stat"><small>Cliques</small><b>316</b><span>+21 vs. anteontem</span></div>
    <div class="stat"><small>Custo por clique</small><b>R$ 0,27</b><span>melhor da semana</span></div>
  </div>
  <p>Na versão final estes números vêm da conta VELT toda manhã, com um destaque do que mudou.</p>
</template>

<template id="t-ia">
  <div class="card-head"><h2>Universo das IAs</h2><span class="tag">Exemplo</span></div>
  <div class="shot">imagem da notícia</div>
  <h3>A manchete mais importante do dia sobre IA aparece aqui</h3>
  <p>Duas linhas de resumo do que aconteceu e por que importa para o que você constrói.</p>
  <span class="src">Fonte e horário da publicação · notícia 1 de 3</span>
</template>

<template id="t-mkt">
  <div class="card-head"><h2>Marketing e nichos</h2><span class="tag">Exemplo</span></div>
  <ul class="rows">
    <li><b>Tendência</b><span>O que mudou em tráfego pago, Meta Ads e social media nas últimas 24 horas.</span></li>
    <li><b>Monetização</b><span>Um formato ou modelo de receita que está em alta.</span></li>
    <li><b>Nicho para atacar</b><span>Um mercado mal atendido e a ideia de sistema que caberia nele.</span></li>
  </ul>
</template>

<template id="t-studio">
  <div class="card-head"><h2>Estúdio</h2></div>
  <h3>Voz principal em cover acústico</h3>
  <ol class="chain">
    <li><div><b>FabFilter Pro-Q 3</b><span>Passa-alta em 80–90 Hz e corte suave de 2–3 dB entre 250 e 350 Hz.</span></div></li>
    <li><div><b>Waves CLA-76 ou UAD 1176</b><span>Ataque lento, release rápido, 3–4 dB só nos picos.</span></div></li>
    <li><div><b>Tube-Tech CL 1B</b><span>Mais 2–3 dB para assentar a dinâmica sem esmagar.</span></div></li>
    <li><div><b>oeksound Soothe2</b><span>Entre 3 e 6 kHz, o mínimo para tirar a aspereza.</span></div></li>
    <li><div><b>FabFilter Pro-DS</b><span>De-esser depois da compressão, nunca antes.</span></div></li>
    <li><div><b>Valhalla VintageVerb</b><span>Plate em envio, pre-delay de 40–60 ms para a voz ficar na frente.</span></div></li>
  </ol>
</template>

<template id="t-sep">
  <div class="card-head"><h2>Palmeiras</h2><span class="tag">Exemplo</span></div>
  <div class="shot">imagem da notícia</div>
  <h3>A principal notícia do Verdão no dia aparece aqui</h3>
  <ul class="rows">
    <li><b>Próximo jogo</b><span>Adversário, data, horário e onde assistir.</span></li>
    <li><b>Último resultado</b><span>Placar e um resumo de uma linha.</span></li>
  </ul>
</template>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>

<script>
/* ---------- estado compartilhado entre HUD e cena ---------- */
const S = { awake:false, speaking:false, cardOpen:false };
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ---------- HUD ---------- */
(function(){
  const $ = id => document.getElementById(id);
  const cap = $('cap'), card = $('card'), cardIn = $('cardIn'), dock = $('dock'), go = $('go');

  function tick(){
    const d = new Date();
    $('clk').textContent = d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    $('dat').textContent = d.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'}).replace(/\./g,'');
  }
  tick(); setInterval(tick, 15000);

  const ICON = {
    sol:'<svg viewBox="0 0 24 24" fill="none" stroke="#ffb573" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>',
    nuvem:'<svg viewBox="0 0 24 24" fill="none" stroke="#93b3cc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18h10a4 4 0 0 0 .5-7.97A5.5 5.5 0 0 0 7 9.5 4.25 4.25 0 0 0 7 18z"/></svg>',
    chuva:'<svg viewBox="0 0 24 24" fill="none" stroke="#4fd8ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15h10a4 4 0 0 0 .5-7.97A5.5 5.5 0 0 0 7 6.5 4.25 4.25 0 0 0 7 15z"/><path d="M9 18l-1 2.5M13 18l-1 2.5M17 18l-1 2.5"/></svg>'
  };
  const WEEK = [['sol',26],['sol',27],['nuvem',25],['chuva',22],['chuva',21],['nuvem',24],['sol',26]];

  const STEPS = [
    {id:'clima', chip:'Clima', say:'Clima primeiro, Louis. Santo André, São Bernardo e Mauá lado a lado, com a previsão da semana.'},
    {id:'velt', chip:'VELT', say:'Depois, os anúncios da VELT: quanto gastou, quanto alcançou e o que mudou desde ontem.'},
    {id:'ia', chip:'IAs', say:'No universo das IAs, cada notícia chega com a imagem e a fonte.'},
    {id:'mkt', chip:'Marketing', say:'Marketing, tráfego e os nichos que valem um sistema novo.'},
    {id:'studio', chip:'Estúdio', say:'Do estúdio, a cadeia do dia: voz principal em cover acústico.'},
    {id:'sep', chip:'Palmeiras', say:'E pra fechar, o Verdão.'}
  ];

  let run = 0;
  const wait = (ms, id) => new Promise(r => setTimeout(() => r(id === run), ms));

  async function type(text, id){
    S.speaking = true;
    if (REDUCE){ cap.textContent = text; await wait(1200, id); }
    else {
      cap.textContent = '';
      for (let i = 1; i <= text.length; i++){
        if (id !== run) return false;
        cap.textContent = text.slice(0, i);
        await wait(26, id);
      }
    }
    S.speaking = false;
    return id === run;
  }

  function fill(stepId){
    cardIn.replaceChildren($('t-' + stepId).content.cloneNode(true));
    cardIn.scrollTop = 0;
    const w = cardIn.querySelector('#week');
    if (w){
      const names = ['dom','seg','ter','qua','qui','sex','sáb'], t = new Date().getDay();
      w.innerHTML = WEEK.map((d,i) => '<div>' + names[(t+i)%7] + ICON[d[0]] + '<b>' + d[1] + '°</b></div>').join('');
    }
  }
  function show(stepId){
    fill(stepId);
    card.hidden = false; S.cardOpen = true;
    requestAnimationFrame(() => requestAnimationFrame(() => card.classList.remove('out')));
    dock.querySelectorAll('.chip').forEach(c => c.setAttribute('aria-pressed', c.dataset.id === stepId));
  }
  async function hide(id){
    card.classList.add('out');
    await wait(REDUCE ? 0 : 420, id);
  }
  function addChip(step){
    if (dock.querySelector('[data-id="' + step.id + '"]')) return;
    const b = document.createElement('button');
    b.type = 'button'; b.className = 'chip'; b.dataset.id = step.id; b.textContent = step.chip;
    b.setAttribute('aria-pressed','false');
    b.addEventListener('click', () => { run++; S.speaking = false; go.hidden = false; go.textContent = 'Repetir briefing'; cap.textContent = step.say; show(step.id); });
    dock.appendChild(b);
  }

  async function briefing(){
    const id = ++run;
    go.hidden = true; dock.replaceChildren(); S.awake = true;
    card.classList.add('out'); S.cardOpen = false;
    if (!await type('E aí, Louis! AION na escuta. Sistemas online e briefing do dia carregado.', id)) return;
    if (!await wait(900, id)) return;
    for (const step of STEPS){
      show(step.id);
      if (!await type(step.say, id)) return;
      if (!await wait(step.id === 'studio' ? 5200 : 3400, id)) return;
      await hide(id); if (id !== run) return;
      addChip(step);
    }
    card.hidden = true; S.cardOpen = false;
    if (!await type('Briefing concluído. Toque em qualquer seção para rever.', id)) return;
    go.textContent = 'Repetir briefing'; go.hidden = false;
  }
  go.addEventListener('click', briefing);
})();

/* ---------- cena 3D ---------- */
(function(){
  if (!window.THREE){ document.body.classList.add('nogl'); return; }
  const canvas = document.getElementById('stage');
  let renderer;
  try { renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'}); }
  catch(e){ document.body.classList.add('nogl'); return; }
  const V3 = THREE.Vector3;
  const small = Math.min(innerWidth, innerHeight) < 700;
  const DPR = Math.min(window.devicePixelRatio || 1, small ? 1.5 : 1.75);
  renderer.setPixelRatio(DPR);
  renderer.setClearColor(0x03050c, 1);

  function rng(seed){ return function(){ seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  const rnd = rng(7);

  const NOISE = `
    float hash(vec3 p){ p=fract(p*0.3183099+.1); p*=17.0; return fract(p.x*p.y*p.z*(p.x+p.y+p.z)); }
    float noise(vec3 x){ vec3 i=floor(x), f=fract(x); f=f*f*(3.-2.*f);
      return mix(mix(mix(hash(i),hash(i+vec3(1,0,0)),f.x),mix(hash(i+vec3(0,1,0)),hash(i+vec3(1,1,0)),f.x),f.y),
                 mix(mix(hash(i+vec3(0,0,1)),hash(i+vec3(1,0,1)),f.x),mix(hash(i+vec3(0,1,1)),hash(i+vec3(1,1,1)),f.x),f.y),f.z); }
    float fbm(vec3 p){ float a=.5,s=0.; for(int i=0;i<6;i++){ s+=a*noise(p); p=p*2.03+vec3(1.7,9.2,3.1); a*=.5; } return s; }
  `;

  const SUN_SEEN = new V3(-.58,.36,-.73).normalize();   // onde o sol aparece na janela
  const SUN_LIGHT = new V3(-.78,.36,-.35).normalize();  // de onde a luz bate nos corpos

  const scene = new THREE.Scene();
  const FOV_L = 58, FOV_P = 74;
  const camera = new THREE.PerspectiveCamera(FOV_L, 1, .1, 3000);
  let aspect = 1, fov = FOV_L * Math.PI / 180;

  /* --- céu: nebulosa procedural assada uma vez em cubemap --- */
  const skyScene = new THREE.Scene();
  skyScene.add(new THREE.Mesh(new THREE.SphereGeometry(500, 48, 32), new THREE.ShaderMaterial({
    side: THREE.BackSide,
    vertexShader: `varying vec3 vDir; void main(){ vDir=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: `varying vec3 vDir; ${NOISE}
      float stars(vec3 d, float sc, float thr){ vec3 p=d*sc; vec3 id=floor(p); vec3 f=fract(p)-.5; float h=hash(id);
        vec3 o=vec3(hash(id+3.1),hash(id+7.7),hash(id+11.3))-.5; float dd=length(f-o*.6);
        return step(thr,h)*smoothstep(.24,0.,dd)*(.4+.6*hash(id+19.)); }
      void main(){
        vec3 d=normalize(vDir);
        vec3 ax=normalize(vec3(.28,.9,.33));
        float band=exp(-pow(dot(d,ax)*2.4,2.));
        vec3 q=d*2.1;

        vec3 c=mix(vec3(.10,.45,1.),vec3(.65,.95,1.),vS); gl_FragColor=vec4(c*a*(.25+uWake*.5+uAmp*.4),1.); }`}));
    p.frustumCulled = false; orb.add(p);
  })();
  const filaments = [];
  (function(){
    const M = 240, aa = new Float32Array(M), dp = new Float32Array(M*3); for (let i = 0; i < M; i++) aa[i] = i/M*6.2832;
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.BufferAttribute(dp, 3)); g.setAttribute('a', new THREE.BufferAttribute(aa, 1));
    for (let i = 0; i < 16; i++){
      const m = new THREE.ShaderMaterial({transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
        uniforms: {uTime: orbU.uTime, uAmp: orbU.uAmp, uWake: orbU.uWake, uSeed: {value: rnd()*10}},
        vertexShader: `attribute float a; uniform float uTime,uAmp,uSeed; void main(){ float t=uTime;
          float r=1.10+.10*sin(a*3.+t*.9+uSeed*6.)+.06*sin(a*7.-t*1.7+uSeed*11.)+uAmp*.16*sin(a*11.+t*7.+uSeed*3.);
          vec3 p=vec3(cos(a)*r,sin(a)*r,.18*sin(a*2.+t*.6+uSeed*4.)+.08*sin(a*5.-t*1.3+uSeed));
          gl_Position=projectionMatrix*modelViewMatrix*vec4(p,1.); }`,
        fragmentShader: `uniform float uWake,uAmp; void main(){ gl_FragColor=vec4(vec3(.22,.72,1.)*(.18+uWake*.42+uAmp*.5),1.); }`});
      const l = new THREE.LineLoop(g, m); l.frustumCulled = false;
      l.rotation.set(rnd()*3.14, rnd()*3.14, rnd()*3.14); l.userData.w = new V3(rnd()-.5, rnd()-.5, rnd()-.5).multiplyScalar(.5);
      orb.add(l); filaments.push(l);
    }
  })();
  const rings = [];
  [[1.52,.9,.25],[1.72,-.6,1.2]].forEach((cfg, i) => {
    const m = new THREE.ShaderMaterial({side: THREE.DoubleSide, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, uniforms: {uWake: orbU.uWake, uN: {value: i ? 90 : 48}},
      vertexShader: `varying vec2 vL; void main(){ vL=position.xy; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
      fragmentShader: `uniform float uWake,uN; varying vec2 vL; void main(){ float a=atan(vL.y,vL.x)/6.2832+.5; float t=step(.5,fract(a*uN)); float gap=step(.08,fract(a*3.+.1));
        gl_FragColor=vec4(vec3(.30,.82,1.)*(.25+.75*t)*gap*(.2+uWake*.6),1.); }`});
    const r = new THREE.Mesh(new THREE.RingGeometry(cfg[0], cfg[0]+.022, 160, 1), m); r.rotation.set(cfg[1]+1.2, cfg[2], 0); r.userData.sp = i ? -.11 : .16; orb.add(r); rings.push(r);
  });
  const orbLight = new THREE.PointLight(0x39b8ff, 1.2, 26, 2); scene.add(orbLight);
  const beam = new THREE.Mesh(new THREE.CylinderGeometry(.8, .16, 1, 40, 1, true), new THREE.ShaderMaterial({side: THREE.DoubleSide, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, uniforms: orbU,
    vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
    fragmentShader: `uniform float uTime,uWake,uAmp; varying vec2 vUv; void main(){ float a=pow(1.-vUv.y,1.6)*(.55+.45*sin(vUv.y*70.-uTime*5.));
      gl_FragColor=vec4(vec3(.16,.62,1.)*a*(.10+uWake*.22+uAmp*.15),1.); }`}));
  scene.add(beam);

  /* --- pós-processamento --- */
  let composer = null, bloom = null;
  if (THREE.EffectComposer && THREE.UnrealBloomPass){
    try {
      composer = new THREE.EffectComposer(renderer);
      composer.addPass(new THREE.RenderPass(scene, camera));
      bloom = new THREE.UnrealBloomPass(new THREE.Vector2(256,256), small ? .7 : .8, .6, .7);
      composer.addPass(bloom);
    } catch(e){ composer = null; }
  }

  /* --- tamanho, alvo do orbe --- */
  const orbPos = new V3(0,.3,-7); let orbR = 1;
  function orbTarget(){
    const Zo = 7, H7 = Math.tan(fov/2)*Zo, W7 = H7*aspect, land = aspect > 1.05;
    if (land) return {x: S.cardOpen ? -W7*.36 : 0, y: H7*.10, r: H7*.29};
    return {x: 0, y: S.cardOpen ? H7*.50 : H7*.14, r: S.cardOpen ? Math.min(W7*.38, H7*.2) : Math.min(W7*.44, H7*.3)};
  }
  function resize(){
    const w = canvas.clientWidth || innerWidth, h = canvas.clientHeight || innerHeight;
    aspect = w/h; camera.aspect = aspect; camera.fov = aspect > 1.05 ? FOV_L : FOV_P; fov = camera.fov*Math.PI/180; camera.updateProjectionMatrix();
    renderer.setSize(w, h, false); if (composer) composer.setSize(w, h);
    buildCockpit();
    const t = orbTarget(); if (!resize.done){ orbPos.set(t.x, t.y, -7); orbR = t.r; resize.done = true; }
  }
  resize(); addEventListener('resize', resize);

  let mx = 0, my = 0;
  addEventListener('pointermove', e => { mx = e.clientX/innerWidth*2-1; my = e.clientY/innerHeight*2-1; });
  const cam = new V3(), up = new V3(0,1,0), tmp = new V3(), look = new V3(0,0,-40);
  let amp = 0, wake = .35, last = performance.now(), T = 0;

  function frame(now){
    const dt = Math.min(.05, (now-last)/1000); last = now; T += dt;
    const sway = REDUCE ? 0 : 1;
    cam.set(mx*.22 + Math.sin(T*.21)*.05*sway, -my*.13 + Math.sin(T*.17+1)*.035*sway, 0);
    camera.position.lerp(cam, Math.min(1, dt*3)); camera.lookAt(look);
    camera.rotation.z = Math.sin(T*.11)*.006*sway;

    far.rotation.y = Math.sin(T*.013)*.05*sway; far.rotation.x = Math.sin(T*.009+2)*.02*sway;
    far.userData.stars.uniforms.uTime.value = T;
    planetU.uTime.value = T; ring.rotation.z = T*.004; moon.rotation.y = T*.02;

    for (const b of belts){
      for (let i = 0; i < b.items.length; i++){ const it = b.items[i];
        if (!REDUCE) it.u += it.v*dt; if (it.u > 1) it.u -= 1;
        dummy.position.copy(A).addScaledVector(dirAB, it.u*lenAB).add(it.off);
        dummy.quaternion.setFromAxisAngle(it.ax, it.ph + T*it.sp); dummy.scale.setScalar(it.s); dummy.updateMatrix(); b.im.setMatrixAt(i, dummy.matrix); }
      b.im.instanceMatrix.needsUpdate = true;
    }

    const tgtAmp = S.speaking ? .3 + .7*Math.pow(Math.abs(Math.sin(T*7.3)*Math.sin(T*3.1+1.3)), .6) : 0;
    amp += (tgtAmp-amp)*Math.min(1, dt*10); wake += ((S.awake ? 1 : .35)-wake)*Math.min(1, dt*1.5);
    orbU.uTime.value = T; orbU.uAmp.value = amp; orbU.uWake.value = wake;
    const tg = orbTarget(), k = Math.min(1, dt*2.2);
    orbPos.x += (tg.x-orbPos.x)*k; orbPos.y += (tg.y-orbPos.y)*k; orbR += (tg.r-orbR)*k;
    orb.position.copy(orbPos); orb.position.y += Math.sin(T*.8)*.03*orbR*sway; orb.scale.setScalar(orbR*(1+amp*.04));
    nucleus.scale.setScalar(.9 + wake*.5 + amp*.7);
    for (const l of filaments){ l.rotation.x += l.userData.w.x*dt*(.4+amp); l.rotation.y += l.userData.w.y*dt*(.4+amp); l.rotation.z += l.userData.w.z*dt*(.4+amp); }
    for (const r of rings) r.rotation.z += r.userData.sp*dt*(1+amp*2);
    orbLight.position.copy(orb.position); orbLight.intensity = .5 + wake*1.1 + amp*1.2;
    veins.offset.x -= dt*.05; veins2.offset.x += dt*.02;
    hullMat.emissiveIntensity = .4 + wake*.35 + amp*.45;
    glyphA.opacity = .55 + .25*Math.sin(T*1.7) + amp*.2; glyphB.opacity = .55 + .25*Math.sin(T*1.3+2) + amp*.2;

    tmp.copy(orb.position).sub(emitter); const dist = tmp.length();
    beam.position.copy(emitter).addScaledVector(tmp, .5); beam.quaternion.setFromUnitVectors(up, tmp.normalize()); beam.scale.set(orbR, dist, orbR);

    if (composer) composer.render(); else renderer.render(scene, camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
