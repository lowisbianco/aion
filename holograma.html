<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Holograma da Via Láctea</title>
<meta name="description" content="Holograma interativo da Via Láctea da nave do AION: Sistema Solar, estrelas vizinhas, sistemas com planetas, nebulosas e buracos negros.">
<style>
:root{--cy:#5fe4ff;--ink:#e8f6ff;--dim:#8fb3c9;--line:rgba(95,228,255,.28);--bg:#02060d;--warn:#ffb46b;
  --fd:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;--fb:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:400 14px/1.45 var(--fb);overflow:hidden;-webkit-tap-highlight-color:transparent}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
button{font:inherit;color:inherit}
.hud{position:fixed;z-index:5;left:0;right:0;top:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;
  background:linear-gradient(#02060de6,#02060d00);pointer-events:none}
.hud>*{pointer-events:auto}
.brand{font:600 12px/1 var(--fd);letter-spacing:.24em;text-transform:uppercase;color:var(--cy);text-shadow:0 0 12px rgba(95,228,255,.6);margin-right:6px;white-space:nowrap}
.crumbs{display:flex;gap:4px;flex-wrap:wrap;padding:3px;border:1px solid var(--line);border-radius:999px;background:rgba(3,14,26,.55);backdrop-filter:blur(6px)}
.crumbs button{border:0;background:none;border-radius:999px;padding:6px 11px;font:600 10.5px var(--fd);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);cursor:pointer}
.crumbs button[aria-pressed="true"]{background:var(--cy);color:#03121f}
.crumbs button:focus-visible,.btn:focus-visible,.lbl:focus-visible,.item:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.btn{border:1px solid var(--line);background:rgba(3,14,26,.6);border-radius:999px;padding:7px 13px;font:600 10.5px var(--fd);letter-spacing:.12em;text-transform:uppercase;cursor:pointer;backdrop-filter:blur(6px)}
.btn.pri{background:var(--cy);color:#03121f;border-color:var(--cy)}
.btn:hover{border-color:var(--cy)}
.sp{flex:1}
.panel{position:fixed;z-index:6;background:rgba(3,14,26,.78);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(10px);
  box-shadow:0 0 30px rgba(95,228,255,.12),inset 0 0 40px rgba(95,228,255,.05);overflow:hidden;display:flex;flex-direction:column}
.panel::before{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(95,228,255,.035) 0 1px,transparent 1px 3px)}
.ph{display:flex;align-items:center;gap:8px;padding:11px 12px 9px 14px;border-bottom:1px solid var(--line)}
.ph b{font:600 11px var(--fd);letter-spacing:.2em;text-transform:uppercase;color:var(--cy)}
.x{margin-left:auto;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:none;cursor:pointer;font-size:15px;line-height:1}
#cat{left:16px;top:64px;bottom:16px;width:min(320px,calc(100vw - 32px));transform:translateX(-110%);transition:transform .35s cubic-bezier(.2,.9,.3,1)}
#cat.on{transform:none}
#cat input{margin:10px 12px 4px;padding:9px 12px;border-radius:10px;border:1px solid var(--line);background:rgba(0,0,0,.35);color:var(--ink);font:inherit;outline:none}
#cat input:focus{border-color:var(--cy)}
.list{overflow:auto;padding:4px 8px 14px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.list h4{font:600 10px var(--fd);letter-spacing:.18em;text-transform:uppercase;color:var(--dim);margin:14px 6px 6px}
.item{display:flex;width:100%;align-items:center;gap:9px;text-align:left;border:0;background:none;border-radius:9px;padding:7px 8px;cursor:pointer}
.item:hover{background:rgba(95,228,255,.1)}
.item i{width:8px;height:8px;border-radius:50%;flex:none;box-shadow:0 0 8px currentColor;background:currentColor}
.item small{display:block;color:var(--dim);font-size:11.5px}
#info{right:16px;bottom:16px;width:min(380px,calc(100vw - 32px));max-height:min(72vh,640px);opacity:0;transform:translateY(16px) scale(.98);pointer-events:none;transition:opacity .3s,transform .3s}
#info.on{opacity:1;transform:none;pointer-events:auto}
#info .body{overflow:auto;padding:12px 14px 14px;scrollbar-width:thin;scrollbar-color:var(--line) transparent}
#info h2{margin:0;font:600 18px/1.25 var(--fd)}
#info .orig{color:var(--warn);font-size:12.5px;margin:3px 0 8px}
#info .kv{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:12.5px;margin:8px 0}
#info .kv span:nth-child(odd){color:var(--dim)}
#info img{width:100%;border-radius:10px;border:1px solid var(--line);display:block;margin:8px 0 4px;background:#000}
#info .cred{font-size:10.5px;color:var(--dim)}
#info p{margin:8px 0;color:#d6e6f6}
#info .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
#labels{position:fixed;inset:0;pointer-events:none;z-index:3;overflow:hidden}
.lbl{position:absolute;left:0;top:0;pointer-events:auto;display:flex;align-items:center;gap:6px;border:0;background:none;padding:4px 6px;cursor:pointer;
  font:600 10.5px/1 var(--fd);letter-spacing:.08em;color:var(--ink);text-shadow:0 0 6px #000,0 0 12px #000;white-space:nowrap;will-change:transform}
.lbl i{width:7px;height:7px;border-radius:50%;background:currentColor;box-shadow:0 0 10px currentColor;flex:none}
.lbl span{color:var(--ink)}
.lbl.sm{font-size:9.5px;opacity:.82}
.lbl:hover span{color:var(--cy)}
#flash{position:fixed;inset:0;z-index:8;pointer-events:none;opacity:0;background:radial-gradient(circle,#bff4ff 0,#5fe4ff55 30%,#02060d 75%);transition:opacity .45s}
#flash.on{opacity:1}
#hint{position:fixed;z-index:4;left:50%;bottom:calc(14px + env(safe-area-inset-bottom));transform:translateX(-50%);font-size:11.5px;color:var(--dim);
  background:rgba(3,14,26,.55);border:1px solid var(--line);border-radius:999px;padding:6px 12px;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
#scale{position:fixed;z-index:4;left:16px;bottom:calc(16px + env(safe-area-inset-bottom));font-size:10.5px;color:var(--dim);max-width:46vw}
#nogl{display:none;position:fixed;inset:0;place-items:center;text-align:center;padding:24px}
body.nogl #nogl{display:grid}
/* projetado na nave, na frente do AION: fundo transparente, sem catálogo nem fichas; tocar num nome escolhe o destino */
html.emb,html.emb body{background:#000}
html.emb .brand,html.emb #bCat,html.emb #cat,html.emb #info,html.emb #scale{display:none!important}
html.emb:not(.full) #hint,html.emb:not(.full) .hud{display:none!important}
html.emb.full .lbl{font-size:12px}html.emb.full .lbl.sm{font-size:10.5px}html.emb.full canvas#c{filter:brightness(1.5) saturate(1.2) contrast(1.05)}
html.emb.full .crumbs{transform:none}
html.emb .hud{background:none;justify-content:center;padding:8px}
html.emb .crumbs{transform:scale(.86)}
html.emb .lbl{font-size:9.5px;text-shadow:0 0 8px rgba(95,228,255,.55)}
html.emb .lbl.sm{font-size:8.5px}
html.emb canvas#c{filter:saturate(.7) brightness(1.05)}
#lock{position:fixed;left:0;top:0;z-index:7;pointer-events:none;width:0;height:0;opacity:0;transition:opacity .25s}
#lock.on{opacity:1}
#lock i{position:absolute;left:-34px;top:-34px;width:68px;height:68px;border-radius:50%;border:1.5px solid var(--cy);box-shadow:0 0 14px var(--cy),inset 0 0 10px rgba(95,228,255,.4);animation:lk 1.1s ease-out infinite}
#lock i+i{border-style:dashed;left:-24px;top:-24px;width:48px;height:48px;animation:lr 2.4s linear infinite}
#lock b{position:absolute;left:44px;top:-22px;white-space:nowrap;font:600 10px/1.3 var(--fd);letter-spacing:.2em;text-transform:uppercase;color:var(--cy);text-shadow:0 0 8px var(--cy)}
#lock b span{display:block;font-size:15px;letter-spacing:.06em;color:#fff;text-transform:none}
@keyframes lk{0%{transform:scale(1.9);opacity:0}40%{opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes lr{to{transform:rotate(360deg)}}
html.foto .hud,html.foto #labels,html.foto #hint,html.foto #scale,html.foto #info{display:none!important}
@media (max-width:640px){#info{left:16px;right:16px;width:auto;bottom:16px;max-height:56vh}#hint{display:none}#scale{display:none}.brand{display:none}}
@media (prefers-reduced-motion:reduce){#cat,#info,#flash{transition:none}}
</style>
</head>
<body>
<canvas id="c" aria-label="Holograma 3D da Via Láctea"></canvas>
<div id="labels"></div>
<header class="hud">
  <span class="brand">Holograma · Via Láctea</span>
  <nav class="crumbs" aria-label="Escala">
    <button data-m="galaxia" aria-pressed="true">Galáxia</button>
    <button data-m="vizinhanca" aria-pressed="false">Vizinhança</button>
    <button data-m="solar" aria-pressed="false">Sistema Solar</button>
  </nav>
  <span class="sp"></span>
  <button class="btn" id="bCat" aria-expanded="false" aria-controls="cat">Catálogo</button>
</header>
<aside id="cat" class="panel" aria-label="Catálogo">
  <div class="ph"><b>Catálogo</b><button class="x" id="xCat" aria-label="Fechar catálogo">×</button></div>
  <input id="q" type="search" placeholder="Buscar estrela, nebulosa, planeta…" aria-label="Buscar">
  <div class="list" id="list"></div>
</aside>
<section id="info" class="panel" aria-live="polite">
  <div class="ph"><b id="iKind">Objeto</b><button class="x" id="xInfo" aria-label="Fechar">×</button></div>
  <div class="body" id="iBody"></div>
</section>
<div id="flash"></div>
<div id="lock" aria-live="polite"><i></i><i></i><b>Destino travado<span></span></b></div>
<div id="hint">Arraste para girar · role ou pince para aproximar · toque num nome para viajar</div>
<div id="scale"></div>
<div id="nogl"><div><b>Este aparelho não abriu o modo 3D.</b><br>O holograma precisa de WebGL ligado no navegador.</div></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
try { const LZ = window.parent !== window && parent.AION_luz; if (LZ && LZ.cor) document.documentElement.style.setProperty('--cy', LZ.cor); } catch(e){}
const EMB = window.parent !== window; if (EMB) document.documentElement.classList.add('emb');
const FOTO = new URLSearchParams(location.search).has('foto'); if (FOTO) document.documentElement.classList.add('foto');   // só para gerar a imagem do holograma pequeno
(function(){
'use strict';
if (!window.THREE) { document.body.classList.add('nogl'); return; }
const V3 = THREE.Vector3, DEG = Math.PI / 180;
const canvas = document.getElementById('c');
let renderer;
try { renderer = new THREE.WebGLRenderer({canvas, antialias: true, powerPreference: 'high-performance'}); if (EMB) renderer.setClearColor(0x000000, 1); /* na nave o fundo preto some: o AION compõe em modo tela */ }
catch (e) { document.body.classList.add('nogl'); return; }
const small = Math.min(innerWidth, innerHeight) < 700;
const DPR = Math.min(devicePixelRatio || 1, small ? 1.5 : 2);
renderer.setPixelRatio(DPR);
renderer.outputEncoding = THREE.sRGBEncoding;
const camera = new THREE.PerspectiveCamera(55, 1, 0.01, 20000);
const controls = new THREE.OrbitControls(camera, canvas);
controls.enableDamping = true; controls.dampingFactor = 0.08; controls.rotateSpeed = 0.6; controls.zoomSpeed = 0.9;
const TL = new THREE.TextureLoader();
const TEX = {};
function tex(url, srgb){ if (!TEX[url]) { const t = TL.load(url); if (srgb !== false) t.encoding = THREE.sRGBEncoding; t.anisotropy = 4; TEX[url] = t; } return TEX[url]; }

/* ---------- coordenadas ---------- */
// Plano galáctico = XZ, Y = polo norte galáctico. Centro galáctico na origem; l = 0 aponta do Sol para o centro.
function dirLB(l, b){ l *= DEG; b *= DEG; return new V3(-Math.sin(l) * Math.cos(b), Math.sin(b), -Math.cos(l) * Math.cos(b)); }
function raDecToLB(ra, dec){ // J2000 -> galácticas
  const aG = 192.85948 * DEG, dG = 27.12825 * DEG, lN = 122.93192;
  ra *= DEG; dec *= DEG;
  const sb = Math.sin(dec) * Math.sin(dG) + Math.cos(dec) * Math.cos(dG) * Math.cos(ra - aG);
  const y = Math.cos(dec) * Math.sin(ra - aG), x = Math.sin(dec) * Math.cos(dG) - Math.cos(dec) * Math.sin(dG) * Math.cos(ra - aG);
  let l = lN - Math.atan2(y, x) / DEG; l = ((l % 360) + 360) % 360;
  return {l, b: Math.asin(sb) / DEG};
}
const G = 0.01;                 // galáxia: 1 unidade = 100 anos-luz
const R0 = 26670;               // distância do Sol ao centro (anos-luz)
const SUN = new V3(0, 0, R0 * G);
const galPos = o => o.center ? new V3(0, 0, 0) : SUN.clone().add(dirLB(o.l, o.b).multiplyScalar(o.d * G));
const nf = (v, d) => v == null ? '—' : Number(v).toLocaleString('pt-BR', {maximumFractionDigits: d == null ? 0 : d});
function tempColor(T){ // cor aproximada de corpo negro
  T = Math.max(1800, Math.min(40000, T || 5800)) / 100; let r, g, b;
  r = T <= 66 ? 255 : 329.7 * Math.pow(T - 60, -0.1332);
  g = T <= 66 ? 99.47 * Math.log(T) - 161.12 : 288.12 * Math.pow(T - 60, -0.0755);
  b = T >= 66 ? 255 : T <= 19 ? 0 : 138.52 * Math.log(T - 10) - 305.04;
  const c = v => Math.max(0, Math.min(255, v)) / 255; return new THREE.Color(c(r), c(g), c(b));
}

/* ---------- catálogo (dados reais aproximados; nomes originais e etimologia) ---------- */
const STARS = [
  {id:'sirius', nome:'Sírius', orig:'Do grego Seírios, “o abrasador”. A estrela mais brilhante do céu noturno.', tipo:'A1V + anã branca', l:227.23, b:-8.89, d:8.6, T:9940, R:1.71, txt:'Sistema duplo: Sírius A, branca-azulada, e Sírius B, uma anã branca do tamanho da Terra.'},
  {id:'alfacen', nome:'Alfa Centauri', orig:'Rigil Kentaurus, do árabe Rijl al-Qinṭūris, “o pé do centauro”.', tipo:'G2V + K1V', l:315.73, b:-0.68, d:4.37, T:5790, R:1.22, txt:'O sistema estelar mais próximo do Sol, com duas estrelas parecidas com ele e a pequena Proxima.'},
  {id:'proxima', nome:'Proxima Centauri', orig:'Do latim proxima, “a mais próxima”.', tipo:'Anã vermelha M5.5V', l:313.94, b:-1.93, d:4.24, T:3042, R:0.154, txt:'A estrela mais próxima do Sol. Tem pelo menos um planeta rochoso na zona habitável, Proxima b.', planetas:[{nome:'Proxima b', dist:0.0485, raio:1.07, periodo:11.2}, {nome:'Proxima d', dist:0.029, raio:0.81, periodo:5.1}]},
  {id:'barnard', nome:'Estrela de Barnard', orig:'Homenagem ao astrônomo E. E. Barnard, que mediu seu movimento em 1916.', tipo:'Anã vermelha M4V', l:31.01, b:14.06, d:5.96, T:3134, R:0.19, txt:'A estrela de maior movimento aparente no céu.'},
  {id:'epseri', nome:'Epsilon Eridani', orig:'Nome IAU Ran, deusa nórdica do mar.', tipo:'K2V', l:195.84, b:-48.05, d:10.5, T:5084, R:0.74, txt:'Estrela jovem com disco de poeira e um planeta gigante.'},
  {id:'procyon', nome:'Prócion', orig:'Do grego Prokyōn, “antes do cão”: nasce antes de Sírius.', tipo:'F5IV + anã branca', l:213.70, b:13.02, d:11.5, T:6530, R:2.05, txt:'Uma das estrelas mais brilhantes do céu, também com uma anã branca companheira.'},
  {id:'tauceti', nome:'Tau Ceti', orig:'Letra grega tau da constelação da Baleia (Cetus).', tipo:'G8V', l:173.10, b:-73.44, d:11.9, T:5344, R:0.79, txt:'Parecida com o Sol e próxima, é alvo clássico na busca por vida.'},
  {id:'altair', nome:'Altair', orig:'Do árabe al-nasr al-ṭā’ir, “a águia voadora”.', tipo:'A7V', l:47.74, b:-8.91, d:16.7, T:7700, R:1.8, txt:'Gira tão rápido que é achatada nos polos.'},
  {id:'vega', nome:'Vega', orig:'Do árabe al-nasr al-wāqi‘, “a águia que mergulha”.', tipo:'A0V', l:67.45, b:19.24, d:25, T:9600, R:2.36, txt:'Foi a estrela polar há 14 mil anos e será de novo daqui a 12 mil.'},
  {id:'arcturus', nome:'Arcturus', orig:'Do grego Arktouros, “guardião da ursa”.', tipo:'Gigante laranja K1.5III', l:15.05, b:69.11, d:36.7, T:4286, R:25.4, txt:'A estrela mais brilhante do hemisfério celeste norte.'},
  {id:'trappist', nome:'TRAPPIST-1', orig:'Nome do telescópio belga TRAPPIST, que descobriu os planetas.', tipo:'Anã ultrafria M8V', l:69.71, b:-56.64, d:40.7, T:2566, R:0.12, txt:'Sete planetas rochosos do tamanho da Terra; três na zona habitável.'},
  {id:'aldebaran', nome:'Aldebarã', orig:'Do árabe al-dabarān, “a seguidora” (segue as Plêiades).', tipo:'Gigante laranja K5III', l:180.97, b:-20.25, d:65, T:3900, R:44, txt:'O olho vermelho do Touro.'},
  {id:'spica', nome:'Espiga', orig:'Do latim spica, “espiga de trigo” na mão da Virgem.', tipo:'B1V', l:316.11, b:50.84, d:250, T:22400, R:7.5, txt:'Par de estrelas azuis quentes tão próximas que se deformam.'},
  {id:'canopus', nome:'Canopus', orig:'Do grego Kanobos, o piloto do navio de Menelau.', tipo:'Supergigante A9II', l:261.21, b:-25.29, d:310, T:7350, R:71, txt:'A segunda estrela mais brilhante do céu; usada por sondas para navegação.'},
  {id:'polaris', nome:'Polaris', orig:'Do latim stella polaris, “estrela do polo”.', tipo:'Supergigante F7Ib', l:123.28, b:26.46, d:433, T:6015, R:46, txt:'A estrela do norte, quase alinhada com o eixo da Terra.'},
  {id:'betelgeuse', nome:'Betelgeuse', orig:'Do árabe yad al-jauzā’, “a mão de Órion”.', tipo:'Supergigante vermelha M1-2Ia', l:199.79, b:-8.96, d:548, T:3600, R:760, txt:'Se estivesse no lugar do Sol, engoliria até a órbita de Marte. Vai explodir como supernova.'},
  {id:'antares', nome:'Antares', orig:'Do grego Anti-Ares, “rival de Marte”, pela cor vermelha.', tipo:'Supergigante vermelha M1.5Iab', l:351.95, b:15.06, d:550, T:3570, R:680, txt:'O coração do Escorpião.'},
  {id:'alnitak', nome:'Alnitak (Três Marias)', orig:'Do árabe an-niṭāq, “o cinturão”. A Três Marias mais a leste do Cinturão de Órion.', tipo:'Supergigante azul O9.5Ib', l:206.45, b:-16.59, d:1260, T:29000, R:20, txt:'A mais quente das Três Marias; ilumina a Nebulosa da Chama e fica ao lado da Cabeça de Cavalo.'},
  {id:'alnilam', nome:'Alnilam (Três Marias)', orig:'Do árabe an-niẓām, “o colar de pérolas”. A estrela do meio do Cinturão de Órion.', tipo:'Supergigante azul B0Ia', l:205.21, b:-17.24, d:1340, T:27000, R:42, txt:'A mais luminosa das Três Marias, cerca de 400 mil vezes o brilho do Sol.'},
  {id:'mintaka', nome:'Mintaka (Três Marias)', orig:'Do árabe al-minṭaqa, “o cinturão”. A Três Marias mais a oeste.', tipo:'Sistema múltiplo O9.5II', l:203.86, b:-17.74, d:1200, T:29500, R:16, txt:'Fica quase exatamente sobre o equador celeste: nasce no leste e se põe no oeste em qualquer lugar da Terra.'},
  {id:'rigel', nome:'Rigel', orig:'Do árabe rijl al-jabbār, “o pé do gigante”.', tipo:'Supergigante azul B8Ia', l:209.24, b:-25.25, d:860, T:12100, R:79, txt:'Cerca de 120 mil vezes mais luminosa que o Sol.'},
  {id:'deneb', nome:'Deneb', orig:'Do árabe dhanab al-dajājah, “a cauda da galinha”.', tipo:'Supergigante branca A2Ia', l:84.28, b:1.99, d:2600, T:8525, R:200, txt:'Uma das estrelas mais luminosas conhecidas a olho nu.'},
  {id:'vycma', nome:'VY Canis Majoris', orig:'Designação de estrela variável no Cão Maior.', tipo:'Hipergigante vermelha', l:239.35, b:-5.07, d:3900, T:3490, R:1420, txt:'Uma das maiores estrelas conhecidas, perdendo massa em nuvens gigantes.'},
  {id:'uyscuti', nome:'UY Scuti', orig:'Designação de estrela variável no Escudo.', tipo:'Supergigante vermelha', l:27.35, b:-0.93, d:5900, T:3365, R:900, txt:'Já foi considerada a maior estrela conhecida; medidas novas do Gaia a puseram mais perto e um pouco menor.'},
  {id:'etacar', nome:'Eta Carinae', orig:'Letra grega eta da constelação da Quilha (Carina).', tipo:'Variável luminosa azul', l:287.60, b:-0.63, d:7500, T:36000, R:240, txt:'Sistema duplo instável que teve uma grande erupção em 1843; dentro da Nebulosa de Carina.'}
];

const GLOW = (function(){ const c = document.createElement('canvas'); c.width = c.height = 128; const g = c.getContext('2d');
  const gr = g.createRadialGradient(64, 64, 0, 64, 64, 64); gr.addColorStop(0, 'rgba(255,255,255,1)'); gr.addColorStop(.18, 'rgba(255,255,255,.75)');
  gr.addColorStop(.45, 'rgba(255,255,255,.18)'); gr.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = gr; g.fillRect(0, 0, 128, 128); return new THREE.CanvasTexture(c); })();
function glow(color, s, op){ const m = new THREE.Sprite(new THREE.SpriteMaterial({map: GLOW, color, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: op == null ? 1 : op})); m.scale.setScalar(s); return m; }
function skySphere(r){ if (EMB) return new THREE.Group(); const t = tex('/media/stars-' + (renderer.capabilities.maxTextureSize >= 8192 && !small ? '8k' : '4k') + '.jpg');
  const m = new THREE.Mesh(new THREE.SphereGeometry(r, 48, 32), new THREE.MeshBasicMaterial({map: t, side: THREE.BackSide, depthWrite: false, color: 0x8899aa}));
  m.renderOrder = -10; return m; }
function ring(r, color, op){ const pts = []; for (let i = 0; i <= 128; i++){ const a = i / 128 * Math.PI * 2; pts.push(new V3(Math.cos(a) * r, 0, Math.sin(a) * r)); }
  return new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({color, transparent: true, opacity: op, depthWrite: false})); }
const POINT_VS = `attribute float size; attribute vec3 color; varying vec3 vC; uniform float uScale;
  void main(){ vC=color; vec4 mv=modelViewMatrix*vec4(position,1.); gl_PointSize=clamp(size*uScale/-mv.z,1.,64.); gl_Position=projectionMatrix*mv; }`;
const POINT_FS = `varying vec3 vC; uniform float uOp; void main(){ float d=length(gl_PointCoord-.5); float a=smoothstep(.5,0.,d); gl_FragColor=vec4(vC*a*a*uOp,1.); }`;
function pointsMat(op){ return new THREE.ShaderMaterial({uniforms: {uScale: {value: 300 * DPR}, uOp: {value: op}}, vertexShader: POINT_VS, fragmentShader: POINT_FS,
  transparent: true, depthWrite: false, blending: THREE.AdditiveBlending}); }
let seed = 7; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
const gauss = () => { let u = 0, v = 0; while (!u) u = rnd(); while (!v) v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };

const tmpV = new V3();
function placeLabels(list, w, h){
  const ord = list.slice().sort((a, b) => (a.el.classList.contains('sm') ? 1 : 0) - (b.el.classList.contains('sm') ? 1 : 0)), boxes = [];
  for (const L of ord){ tmpV.copy(L.pos); if (L.obj) L.obj.getWorldPosition(tmpV);
    tmpV.project(camera); let vis = tmpV.z < 1 && Math.abs(tmpV.x) < 1.1 && Math.abs(tmpV.y) < 1.1;
    const x = (tmpV.x + 1) / 2 * w - 9, y = (1 - tmpV.y) / 2 * h - 9;
    if (vis){ if (!L.w) L.w = Math.max(40, L.el.offsetWidth || 90); const bx = [x, y, x + L.w, y + 18];
      if (boxes.some(o => bx[0] < o[2] && bx[2] > o[0] && bx[1] < o[3] && bx[3] > o[1])) vis = false; else boxes.push(bx); }
    if (!vis){ if (L.el.style.display !== 'none') L.el.style.display = 'none'; continue; }
    if (L.el.style.display === 'none') L.el.style.display = '';
    L.el.style.transform = `translate(${x.toFixed(1)}px,${y.toFixed(1)}px)`; }
}
function hideLabels(list){ for (const L of list) L.el.style.display = 'none'; }

/* ================= MODO GALÁXIA ================= */
const MODES = {};
MODES.galaxia = (function(){
  const scene = new THREE.Scene(), labels = [];
  // Via Láctea: barra central, bojo, 2 braços principais (Perseu, Escudo-Centauro), 2 secundários (Sagitário-Carina, Norma), Braço de Órion
  const N = small ? 60000 : 140000, pos = new Float32Array(N * 3), col = new Float32Array(N * 3), size = new Float32Array(N);
  const pitch = Math.tan(12.5 * DEG), phiSun = -Math.PI / 2, armR = [215, 300, 410, 560], armW = [.8, 1, .75, 1];
  const BAR = 27 * DEG; let i = 0;
  const put = (x, y, z, c, s) => { pos[i * 3] = x; pos[i * 3 + 1] = y; pos[i * 3 + 2] = z; col[i * 3] = c[0]; col[i * 3 + 1] = c[1]; col[i * 3 + 2] = c[2]; size[i] = s; i++; };
  const P = (r, phi) => [r * Math.cos(phi), -r * Math.sin(phi)];
  while (i < N){
    const k = rnd();
    if (k < 0.12){ // bojo
      const r = Math.abs(gauss()) * 28, t = rnd() * Math.PI * 2, u = rnd() * 2 - 1, s = Math.sqrt(1 - u * u);
      const w = .85 + rnd() * .15; put(r * s * Math.cos(t), r * u * .55, r * s * Math.sin(t), [1 * w, .82 * w, .58 * w], 2.2 + rnd() * 2);
    } else if (k < 0.2){ // barra
      const a = gauss() * 50, b = gauss() * 11, w = .8 + rnd() * .2;
      const ang = phiSun + Math.PI + BAR; // eixo da barra a ~27° da linha Sol-centro
      const x = a * Math.cos(ang) - b * Math.sin(ang), y2 = a * Math.sin(ang) + b * Math.cos(ang);
      put(x, gauss() * 4, -y2, [1 * w, .78 * w, .55 * w], 2 + rnd() * 1.5);
    } else if (k < 0.82){ // braços espirais
      const arm = Math.floor(rnd() * 4); if (rnd() > armW[arm]) continue;
      const r = 45 + Math.pow(rnd(), 1.15) * 520, phi = phiSun + Math.log(r / armR[arm]) / pitch;
      const spread = (0.05 * r + 4) * (0.5 + rnd()), off = gauss() * spread, a2 = gauss() * spread * 0.6;
      const p = P(r + off, phi + a2 / r); const fall = Math.exp(-r / 380);
      const hii = rnd() < 0.035, young = Math.abs(off) < spread * 0.5;
      const c = hii ? [1, .42, .62] : young ? [.62, .76, 1] : [.9, .86, .82];
      const w = (0.45 + fall * 0.9) * (hii ? 1.6 : 1);
      put(p[0], gauss() * (2 + r * 0.004), p[1], [c[0] * w, c[1] * w, c[2] * w], hii ? 3.2 : 1.4 + rnd() * 1.6);
    } else if (k < 0.85){ // Braço de Órion (onde o Sol mora)
      const t = rnd() * 2 - 1, r = 266.7 + t * 30 + gauss() * 6, phi = phiSun + t * 0.2 + gauss() * 0.02;
      const p = P(r, phi); put(p[0], gauss() * 2, p[1], [.62 * .8, .76 * .8, .9], 1.4 + rnd());
    } else { // disco difuso
      const r = -Math.log(1 - rnd() * .995) * 140, t = rnd() * Math.PI * 2, w = .35 * Math.exp(-r / 500);
      put(r * Math.cos(t), gauss() * 3, r * Math.sin(t), [.9 * w + .05, .85 * w + .05, .8 * w + .06], 1.2 + rnd());
    }
  }
  const g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('color', new THREE.BufferAttribute(col, 3)); g.setAttribute('size', new THREE.BufferAttribute(size, 1));
  const gm = pointsMat(0.9); if (FOTO) gm.uniforms.uScale.value *= 2.2; const galaxy = new THREE.Points(g, gm); galaxy.frustumCulled = false; scene.add(galaxy);
  scene.add(glow(0xffd9a0, 120, .55)); scene.add(glow(0xfff0d0, 40, .8));
  // grade holográfica
  [100, 200, 300, 400, 500].forEach(r => { const L = ring(r, 0x5fe4ff, .08); if (!FOTO) scene.add(L); });
  const sunRing = ring(3, 0x5fe4ff, .7); sunRing.position.copy(SUN); scene.add(sunRing);
  const sunG = glow(0xfff4c0, 8, 1); sunG.position.copy(SUN); scene.add(sunG);
  labels.push({pos: SUN.clone(), el: makeLabel('Sol · você está aqui', '#fff2b0', () => go({k: 'viz'}))});
  const add = (o, k, color) => { const p = galPos(o); const s = glow(color, k === 'bn' ? 5 : 4, .95); s.position.copy(p); scene.add(s);
    labels.push({pos: p, el: makeLabel(o.nome, color, () => go({k, o}), k === 'estrela' ? 'sm' : '')}); };
  NEBS.forEach(o => add(o, 'neb', o.cor));
  BHS.filter(o => !o.extra).forEach(o => add(o, 'bn', '#c79bff'));
  STARS.filter(o => o.d > 500).forEach(o => add(o, 'estrela', '#' + tempColor(o.T).getHexString()));
  return {scene, labels, scale: 'Escala: 1 grade = 10 mil anos-luz · a Via Láctea tem uns 100 mil anos-luz de diâmetro',
    enter(){ camera.near = 0.5; camera.far = 8000; camera.updateProjectionMatrix(); controls.minDistance = 4; controls.maxDistance = 1500;
      flyTo(new V3(140, 520, 760), new V3(0, 0, 60), 0); },
    update(t){ sunRing.scale.setScalar(1 + 0.15 * Math.sin(t * 2)); }};
})();

/* ================= MODO VIZINHANÇA SOLAR ================= */
const vScale = d => d <= 50 ? d : 50 + Math.log10(d / 50) * 70; // linear até 50 anos-luz, comprimida depois
MODES.vizinhanca = (function(){
  const scene = new THREE.Scene(), labels = [], exoLabels = [];
  scene.add(skySphere(3000));
  [10, 25, 50].forEach(r => scene.add(ring(r, 0x5fe4ff, .22)));
  [500, 1000, 5000].forEach(d => scene.add(ring(vScale(d), 0x5fe4ff, .1)));
  const sun = glow(0xfff4c0, 3.2, 1); scene.add(sun);
  labels.push({pos: new V3(), el: makeLabel('Sol', '#fff2b0', () => go({k: 'solar'}))});
  const local = o => dirLB(o.l, o.b).multiplyScalar(vScale(o.d)).sub(dirLB(0, 0).multiplyScalar(0)); // centrado no Sol
  STARS.forEach(o => { const p = local(o), c = tempColor(o.T); const s = glow(c, 1.4 + Math.log10(1 + o.R) * 1.4, 1); s.position.copy(p); scene.add(s);
    const stem = new THREE.Line(new THREE.BufferGeometry().setFromPoints([p, new V3(p.x, 0, p.z)]), new THREE.LineBasicMaterial({color: 0x5fe4ff, transparent: true, opacity: .18}));
    scene.add(stem); labels.push({pos: p, el: makeLabel(o.nome, '#' + c.getHexString(), () => go({k: 'estrela', o}))}); });
  const exoGroup = new THREE.Group(); scene.add(exoGroup);
  function addExo(list){
    list.forEach(s => { if (s.ra == null || s.dec == null) return; const lb = raDecToLB(s.ra, s.dec);
      if (STARS.some(o => s.nome.toLowerCase().includes(o.nome.toLowerCase().split(' ')[0]) && Math.abs(o.d - s.anosLuz) < 2)) return;
      const o = {id: 'exo-' + s.nome, nome: s.nome, l: lb.l, b: lb.b, d: s.anosLuz, T: s.estrela && s.estrela.temp || 4500, R: s.estrela && s.estrela.raio || .8,
        tipo: s.estrela && s.estrela.tipo || 'Estrela com planetas', exo: s,
        txt: `${s.planetas} planeta${s.planetas > 1 ? 's' : ''} confirmado${s.planetas > 1 ? 's' : ''}. Dados do NASA Exoplanet Archive.`,
        planetas: (s.lista || []).map(p => ({nome: p.nome, dist: p.dist, raio: p.raio, periodo: p.periodo, temp: p.temp, ano: p.ano, metodo: p.metodo}))};
      EXO.push(o); const p = local(o); const g = glow(0x7dffcf, 1.3, .9); g.position.copy(p); exoGroup.add(g);
      exoLabels.push({pos: p, el: makeLabel(o.nome + ' (' + s.planetas + ')', '#7dffcf', () => go({k: 'estrela', o}), 'sm')}); });
    labels.push(...exoLabels); buildList();
  }
  fetch('/api/space').then(r => r.ok ? r.json() : null).then(j => { if (j && j.destinos) addExo(j.destinos); }).catch(() => {});
  return {scene, labels, scale: 'Escala real até 50 anos-luz; além disso, comprimida (anéis em 500, 1.000 e 5.000 anos-luz) · verde = sistema com planetas',
    enter(){ camera.near = 0.05; camera.far = 8000; camera.updateProjectionMatrix(); controls.minDistance = 1; controls.maxDistance = 600;
      flyTo(new V3(40, 70, 120), new V3(0, 0, 0), 0); },
    update(t){ sun.scale.setScalar(3.2 + .2 * Math.sin(t * 3)); }};
})();

const SUN_FS = `uniform sampler2D map; uniform float uTime; varying vec2 vUv; varying vec3 vN; varying vec3 vV;
  void main(){ vec2 u=vUv+vec2(uTime*.004,0.); vec3 c=texture2D(map,u).rgb*1.6+texture2D(map,u*2.+uTime*.01).rgb*.4;
    float limb=pow(max(dot(normalize(vN),normalize(vV)),0.),.5); gl_FragColor=vec4(c*(.55+.7*limb)*vec3(1.,.92,.8),1.); }`;
const SUN_VS = `varying vec2 vUv; varying vec3 vN; varying vec3 vV; void main(){ vUv=uv; vN=normalMatrix*normal; vec4 mv=modelViewMatrix*vec4(position,1.); vV=-mv.xyz; gl_Position=projectionMatrix*mv; }`;
MODES.solar = (function(){
  const scene = new THREE.Scene(), labels = [], bodies = [];
  scene.add(skySphere(4000));
  scene.add(new THREE.AmbientLight(0x223344, .35));
  const light = new THREE.PointLight(0xfff3e0, 2.2, 0, 0); scene.add(light);
  const sunU = {map: {value: tex('/media/tex/sun.jpg')}, uTime: {value: 0}};
  const sun = new THREE.Mesh(new THREE.SphereGeometry(4, 64, 48), new THREE.ShaderMaterial({uniforms: sunU, vertexShader: SUN_VS, fragmentShader: SUN_FS}));
  scene.add(sun); scene.add(glow(0xffc070, 22, .75)); scene.add(glow(0xffe0a0, 11, .9));
  labels.push({pos: new V3(0, 4.6, 0), el: makeLabel('Sol', '#fff2b0', () => EMB ? choose({k: 'planeta', o: SOLP}) : showInfo({k: 'sol'}))});
  PLANETS.forEach((p, n) => {
    const piv = new THREE.Group(); piv.rotation.y = n * 1.7; scene.add(piv);
    const orbit = ring(p.a, 0x5fe4ff, .16); scene.add(orbit);
    const mat = new THREE.MeshStandardMaterial({map: tex('/media/tex/' + p.tex + '.jpg'), roughness: .9, metalness: 0});
    const m = new THREE.Mesh(new THREE.SphereGeometry(p.r * .5, 48, 32), mat); m.position.x = p.a; piv.add(m);
    if (p.cl){ const c = new THREE.Mesh(new THREE.SphereGeometry(p.r * .5 * 1.015, 48, 32), new THREE.MeshStandardMaterial({map: tex('/media/tex/' + p.cl + '.jpg'), transparent: true, opacity: .75, blending: THREE.AdditiveBlending, depthWrite: false})); m.add(c); p._cl = c;
      const moon = new THREE.Mesh(new THREE.SphereGeometry(.14, 24, 16), new THREE.MeshStandardMaterial({map: tex('/media/tex/moon.jpg'), roughness: 1})); moon.position.x = 1.1; const mp = new THREE.Group(); mp.add(moon); m.add(mp); p._moon = mp; }
    if (p.ring){ const rg = new THREE.RingGeometry(p.r * .5 * 1.25, p.r * .5 * 2.3, 96, 1); const uv = rg.attributes.uv, P = rg.attributes.position;
      for (let k = 0; k < uv.count; k++){ const v = new V3().fromBufferAttribute(P, k); uv.setXY(k, (v.length() - p.r * .5 * 1.25) / (p.r * .5 * 1.05), .5); }
      const t = tex('/media/tex/saturn_ring_alpha.png'); const rm = new THREE.Mesh(rg, new THREE.MeshStandardMaterial({map: t, alphaMap: t, transparent: true, side: THREE.DoubleSide, depthWrite: false}));
      rm.rotation.x = -Math.PI / 2 + .45; m.add(rm); }
    m.rotation.z = n === 6 ? 1.7 : .25;
    bodies.push({p, piv, m}); labels.push({obj: m, pos: new V3(), el: makeLabel(p.nome, '#cfe9ff', () => go({k: 'planeta', o: p}))});
  });
  let focus = null;
  return {scene, labels, scale: 'Tamanhos e distâncias fora de escala para caber tudo na tela · texturas de mapas reais dos planetas',

document.getElementById('xInfo').onclick = hideInfo;
let orbiting = false;
iBody.addEventListener('click', e => { const a = e.target.closest('[data-a]'); if (!a) return; const A = a.dataset.a;
  if (A === 'galaxia') go({k: 'galaxia'});
  else if (A === 'nave' && CUR){ const o = CUR.o, d = {nome: o.nome.replace(/\s*\(.*\)$/, ''), anosLuz: Math.round(o.d || 0), planetas: o.planetas ? o.planetas.length : 0, estrela: {temp: o.T || (CUR.k === 'bn' ? 3000 : 9000), raio: Math.min(30, o.R || 1)}, lista: (o.planetas || []).map(p => ({nome: p.nome, raio: p.raio, temp: p.temp}))};
    parent.postMessage({aion: 'viajar', d}, location.origin); }
  else if (A === 'atravessar' && mode === 'local') flyTo(new V3(0, 0, -150), new V3(0, 0, -400), 14000, () => flyTo(new V3(0, 0, 170), new V3(0, 0, 0), 0));
  else if (A === 'aproximar' && mode === 'local') flyTo(new V3(0, .9, 7.5), new V3(0, 0, 0), 6000);
  else if (A === 'orbitar' && mode === 'local'){ orbiting = !orbiting; controls.autoRotate = orbiting; controls.autoRotateSpeed = 1.2; } });

/* ---------- catálogo ---------- */
const cat = document.getElementById('cat'), bCat = document.getElementById('bCat'), list = document.getElementById('list'), q = document.getElementById('q');
function openCat(){ cat.classList.add('on'); bCat.setAttribute('aria-expanded', 'true'); setTimeout(() => q.focus(), 300); }
function closeCat(){ cat.classList.remove('on'); bCat.setAttribute('aria-expanded', 'false'); }
bCat.onclick = () => cat.classList.contains('on') ? closeCat() : openCat();
document.getElementById('xCat').onclick = closeCat;
function buildList(){
  const f = (q.value || '').trim().toLowerCase(), m = s => !f || s.toLowerCase().includes(f);
  const groups = [
    ['Sistema Solar', [{nome: 'Sol', sub: 'Nossa estrela', c: '#fff2b0', x: {k: 'solar'}}].concat(PLANETS.map(p => ({nome: p.nome, sub: p.orig, c: '#cfe9ff', x: {k: 'planeta', o: p}})))],
    ['Estrelas com nome', STARS.map(o => ({nome: o.nome, sub: ly(o.d) + ' · ' + o.tipo, c: '#' + tempColor(o.T).getHexString(), x: {k: 'estrela', o}}))],
    ['Sistemas com planetas (NASA)', EXO.map(o => ({nome: o.nome, sub: ly(o.d) + ' · ' + o.planetas.length + ' planeta(s)', c: '#7dffcf', x: {k: 'estrela', o}}))],
    ['Nebulosas', NEBS.map(o => ({nome: o.nome, sub: ly(o.d), c: o.cor, x: {k: 'neb', o}}))],
    ['Buracos negros', BHS.map(o => ({nome: o.nome, sub: ly(o.d) + ' · ' + o.massa, c: '#c79bff', x: {k: 'bn', o}}))]
  ];
  list.innerHTML = ''; const all = [];
  groups.forEach(([t, items]) => { const its = items.filter(i => m(i.nome + ' ' + i.sub)); if (!its.length) return;
    const hEl = document.createElement('h4'); hEl.textContent = t; list.appendChild(hEl);
    its.forEach(i => { const b = document.createElement('button'); b.className = 'item'; b.innerHTML = '<i></i><div><div class="n"></div><small></small></div>';
      b.querySelector('i').style.color = i.c; b.querySelector('.n').textContent = i.nome; b.querySelector('small').textContent = i.sub; b.onclick = () => go(i.x); list.appendChild(b); all.push(b); }); });
  if (!all.length){ const p = document.createElement('p'); p.style.cssText = 'color:var(--dim);padding:8px'; p.textContent = 'Nada encontrado com esse nome.'; list.appendChild(p); }
}
q.addEventListener('input', buildList); buildList();
document.querySelectorAll('.crumbs button').forEach(b => b.onclick = () => { const m = b.dataset.m; if (m === mode) return;
  if (m === 'galaxia') go({k: 'galaxia'}); else if (m === 'vizinhanca') go({k: 'viz'}); else go({k: 'solar'}); });
addEventListener('keydown', e => { if (e.key === 'Escape'){ if (cat.classList.contains('on')) closeCat(); else if (info.classList.contains('on')) hideInfo(); else if (mode !== 'galaxia') go({k: 'galaxia'}); } });
controls.addEventListener('start', () => { tween = null; });

/* ---------- laço ---------- */
let W = 0, H = 0;
function resize(){ W = innerWidth; H = innerHeight; renderer.setSize(W, H, false); camera.aspect = W / H; camera.updateProjectionMatrix(); }
addEventListener('resize', resize); resize();
setMode('galaxia');
if (FOTO){ flyTo(new V3(0, 1320, 1), new V3(0, 0, 0), 0); }
if (EMB){ controls.autoRotate = true; controls.autoRotateSpeed = .6; controls.maxPolarAngle = Math.PI * .47; flyTo(new V3(0, 150, 560), new V3(0, -10, 0), 0); }
/* ---------- teclado: + e − aproximam e afastam, setas giram (também chegam do AION quando o foco está lá) ---------- */
function tecla(k){
  const off = camera.position.clone().sub(controls.target);
  if (k === '+' || k === '=' || k === 'zoomIn'){ off.multiplyScalar(.82); if (off.length() < controls.minDistance) off.setLength(controls.minDistance); }
  else if (k === '-' || k === '_' || k === 'zoomOut'){ off.multiplyScalar(1.22); if (off.length() > controls.maxDistance) off.setLength(controls.maxDistance); }
  else if (k === 'ArrowLeft' || k === 'ArrowRight'){ off.applyAxisAngle(new V3(0, 1, 0), (k === 'ArrowLeft' ? -1 : 1) * .18); }
  else if (k === 'ArrowUp' || k === 'ArrowDown'){ const sph = new THREE.Spherical().setFromVector3(off); sph.phi = Math.max(.15, Math.min(controls.maxPolarAngle, sph.phi + (k === 'ArrowUp' ? -.12 : .12))); off.setFromSpherical(sph); }
  else return false;
  tween = null; flyTo(controls.target.clone().add(off), controls.target.clone(), 260); return true;
}
addEventListener('keydown', e => { if (e.target && e.target.tagName === 'INPUT') return; const k = e.key === 'Add' ? '+' : e.key === 'Subtract' ? '-' : e.key; if (tecla(k)) e.preventDefault(); });
addEventListener('message', e => { if (e.origin === location.origin && e.data && e.data.aion === 'tecla') tecla(e.data.k); });
/* close-up: o AION amplia o holograma para a tela toda; aí a galáxia fica nítida e fácil de manusear */
addEventListener('message', e => { if (e.origin !== location.origin || !e.data || e.data.aion !== 'modo') return;
  document.documentElement.classList.toggle('full', !!e.data.full);
  if (e.data.full && mode === 'galaxia' && !LOCK){ controls.autoRotate = false; flyTo(new V3(110, 470, 700), new V3(0, 0, 40), 1100); }
  else if (!e.data.full){ controls.autoRotate = true; } });
const clock = new THREE.Clock();
renderer.setAnimationLoop(() => {
  const dt = Math.min(clock.getDelta(), .05), t = clock.elapsedTime;
  stepTween(); controls.update();
  const M = MODES[mode]; M.update(t, dt);
  renderer.render(M.scene, camera);
  placeLabels(M.labels, W, H); placeLock();
});
const p = new URLSearchParams(location.search).get('ir');
if (p){ let tries = 0; const t0 = () => { const f = resolve(p);
    if (f){ if (EMB) setTimeout(() => choose(f), 2000); else go(f); }
    else if (++tries < 6 && !EXO.length) setTimeout(t0, 700);   // sistemas da NASA chegam depois
    else if (EMB) parent.postMessage({aion: 'holo-nao', q: p}, location.origin); }; t0(); }
addEventListener('message', e => { if (e.origin !== location.origin || !e.data || e.data.aion !== 'ir') return; const f = resolve(e.data.q);
  if (f) choose(f); else parent.postMessage({aion: 'holo-nao', q: e.data.q}, location.origin); });
})();
</script>
