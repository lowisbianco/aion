<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#03050c">
<meta name="robots" content="noindex,nofollow">
<title>AION</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600&family=Manrope:wght@400;500;600&display=swap">
<style>
/* Ponte de comando em 3D ao fundo; por cima, HUD em vidro: barra no topo, cartão de detalhe à esquerda, legenda, controles e fileira de painéis clicáveis no rodapé. */
:root{
  color-scheme:dark;
  --void:#03050c; --ink:#e8f5ff; --ink-dim:#93b3cc; --holo:#4fd8ff; --holo-deep:#1b6cff; --ember:#ffb573; --ok:#63e6a8;
  --glass:rgba(5,13,27,.84); --glass-2:rgba(79,216,255,.07); --line:rgba(79,216,255,.32);
  --f-display:"Chakra Petch","Segoe UI",system-ui,sans-serif; --f-body:"Manrope","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--void);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;overflow:hidden;-webkit-font-smoothing:antialiased}
body.nogl{background:radial-gradient(120% 90% at 70% 80%,#3a1d2a 0%,#0a1230 38%,var(--void) 75%)}
[hidden]{display:none!important}
button{font:inherit;color:inherit}
#stage{position:fixed;inset:0;width:100%;height:100%;display:block}
.hud{position:fixed;inset:0;display:grid;grid-template-rows:auto minmax(0,1fr) auto;gap:10px;pointer-events:none;
  padding:calc(14px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;font-family:var(--f-display);text-shadow:0 0 12px rgba(3,5,12,.95)}
.brand,.clock{display:grid;gap:3px}
.brand b{font-size:22px;font-weight:600;letter-spacing:.42em}
.brand span,.clock span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim)}
.brand span i{font-style:normal;color:var(--holo)}
.clock{justify-items:end;text-align:right}
.clock b{font-size:22px;font-weight:500;letter-spacing:.08em;font-variant-numeric:tabular-nums}
.live::before{content:"";display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ember);margin-right:6px;vertical-align:1px}
.live.on::before{background:var(--ok);box-shadow:0 0 8px var(--ok)}
.tag{font-family:var(--f-display);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ember);border:1px solid rgba(255,181,115,.5);padding:2px 7px;white-space:nowrap}

.zone{display:flex;align-items:center;justify-content:flex-start;min-height:0;min-width:0;padding-left:2.5vw}
.card{width:min(470px,100%);max-height:100%;display:flex;pointer-events:auto;padding:1px;background:linear-gradient(160deg,var(--holo),rgba(27,108,255,.25) 45%,var(--line));
  clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);transition:opacity .4s ease,transform .4s ease}
.card.out{opacity:0;transform:translateX(-14px)}
.card-in{flex:1;min-width:0;overflow:auto;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);padding:18px 18px 20px;display:grid;gap:14px;align-content:start;
  clip-path:polygon(16px 0,100% 0,100% calc(100% - 16px),calc(100% - 16px) 100%,0 100%,0 16px);scrollbar-width:thin;scrollbar-color:var(--line) transparent}
.card-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.card-head h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--holo)}
.x{pointer-events:auto;background:none;border:1px solid var(--line);width:28px;height:28px;cursor:pointer;font-family:var(--f-display);font-size:14px;line-height:1}
.x:hover{border-color:var(--holo);color:var(--holo)}
.card h3{margin:0;font-family:var(--f-display);font-weight:500;font-size:18px;line-height:1.25;text-wrap:balance}
.card p{margin:0;color:var(--ink-dim)}
.cities{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.city{display:grid;gap:2px;padding:10px 8px;background:var(--glass-2);border:0;border-top:1px solid var(--line);min-width:0;text-align:left;cursor:pointer}
.city[aria-pressed="true"]{background:rgba(79,216,255,.16);border-top-color:var(--holo)}
.city small{font-family:var(--f-display);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);overflow-wrap:anywhere}
.city b{font-family:var(--f-display);font-weight:500;font-size:28px;font-variant-numeric:tabular-nums;display:flex;align-items:center;gap:6px}
.city b svg{width:20px;height:20px}
.city span{font-size:12px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center}
.week div{display:grid;gap:3px;justify-items:center;font-size:11px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
.week b{font-weight:600;color:var(--ink);font-size:12px}
.week svg{width:18px;height:18px}
.week i{font-style:normal;color:var(--holo);font-size:10.5px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.stat{display:grid;gap:2px;padding:10px;background:var(--glass-2);border-top:1px solid var(--line)}
.stat small{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-dim)}
.stat b{font-family:var(--f-display);font-weight:500;font-size:22px;font-variant-numeric:tabular-nums}
.days{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px;text-align:center;font-variant-numeric:tabular-nums}
.days div{display:grid;gap:2px;font-size:11px;color:var(--ink-dim);padding:6px 0;background:var(--glass-2)}
.days b{font-size:12px;font-weight:600;color:var(--ink)}
.note{font-size:13px;padding-left:12px;border-left:1px solid var(--line)}
.note b{color:var(--ink);font-weight:600}
.lock{display:grid;gap:10px}
.lock form{display:flex;gap:8px}
.lock input{flex:1;min-width:0;background:rgba(0,0,0,.35);border:1px solid var(--line);color:var(--ink);padding:10px 12px;font:500 16px var(--f-display);letter-spacing:.3em}
.lock input:focus{outline:2px solid var(--holo);outline-offset:1px}
.news{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.news a{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;align-items:start;color:inherit;text-decoration:none}
.news li:first-child a{grid-template-columns:minmax(0,1fr)}
.shot{aspect-ratio:16/9;width:100%;overflow:hidden;background:linear-gradient(135deg,#0d2a55,#3a1d4f 60%,#5a2a2a);border:1px solid var(--line);display:grid;place-items:center}
.shot img{width:100%;height:100%;object-fit:cover;display:block}
.shot.noimg::after{content:attr(data-src);font-family:var(--f-display);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:rgba(232,245,255,.75);padding:4px;text-align:center}
.news b{display:block;font-family:var(--f-display);font-weight:500;font-size:14.5px;line-height:1.3;color:var(--ink)}
.news li:first-child b{font-size:18px;margin-top:2px}
.news a:hover b{color:var(--holo)}
.news span{display:block;font-size:12px;color:var(--ink-dim);margin-top:3px}
.news em{font-style:normal;color:var(--holo)}
.rows{display:grid;gap:10px;margin:0;padding:0;list-style:none}
.rows li{display:grid;gap:2px;padding-left:12px;border-left:1px solid var(--line)}
.rows b{font-family:var(--f-display);font-weight:500;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--holo)}
.chain{display:grid;gap:9px;margin:0;padding:0;list-style:none;counter-reset:c}
.chain li{counter-increment:c;display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px}
.chain li::before{content:counter(c);font-family:var(--f-display);font-size:12px;color:var(--holo);border:1px solid var(--line);width:22px;height:22px;display:grid;place-items:center}
.chain b{font-weight:600;color:var(--ink)}
.chain span{display:block;color:var(--ink-dim);font-size:13.5px}

.deck{display:grid;gap:10px;justify-items:center;min-width:0}
.caption{max-width:66ch;margin:0;padding:6px 14px;background:rgba(3,5,12,.62);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);text-align:center;font-size:16px;font-weight:500;text-wrap:balance}
.controls{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;pointer-events:auto}
.btn{font-family:var(--f-display);font-size:12.5px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;color:var(--void);background:var(--holo);border:0;padding:11px 18px;cursor:pointer;
  clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);transition:filter .2s}
.btn:hover{filter:brightness(1.15)}
.btn.ghost{background:rgba(6,16,32,.8);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.ghost[aria-pressed="true"]{color:var(--holo);box-shadow:inset 0 0 0 1px var(--holo)}
.btn.rec{color:var(--void);background:linear-gradient(90deg,var(--ember) calc(var(--lvl,0)*100%),rgba(255,181,115,.5) 0)}
.sel{font-family:var(--f-display);font-size:12px;color:var(--ink);background:rgba(6,16,32,.9);border:1px solid var(--line);padding:0 10px;max-width:220px;height:38px}
:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.tiles{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;width:min(1240px,calc(100% - 124px));pointer-events:auto}
.tile{display:grid;gap:3px;align-content:start;text-align:left;min-width:0;padding:10px 12px 11px;cursor:pointer;border:0;background:var(--glass);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);
  border-top:2px solid var(--line);transition:border-color .2s,background .2s,transform .2s}
.tile:hover{border-top-color:var(--holo);background:rgba(9,26,50,.9);transform:translateY(-2px)}
.tile[aria-pressed="true"]{border-top-color:var(--holo);background:rgba(12,36,66,.92)}
.tile small{font-family:var(--f-display);font-size:10.5px;letter-spacing:.18em;text-transform:uppercase;color:var(--holo)}
.tile b{font-family:var(--f-display);font-weight:500;font-size:15px;line-height:1.22;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-variant-numeric:tabular-nums}
.tile b.big{font-size:22px;-webkit-line-clamp:1}
.tile span{font-size:11.5px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}

#mic{display:none;font-family:var(--f-display);font-size:11px;font-weight:600;letter-spacing:.18em;text-transform:uppercase;border:0;padding:8px 16px;cursor:pointer;clip-path:none;border-radius:99px}
#mic.rec,#mic.busy{display:inline-block}
#mic.busy{background:rgba(6,16,32,.85);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.tiles{transition:opacity .35s ease,transform .35s ease;transform-origin:50% 100%}
.tiles.closed{opacity:0;transform:perspective(900px) rotateX(38deg) translateY(30px) scale(.94);pointer-events:none;height:0;overflow:hidden}
.edge{position:fixed;top:14%;bottom:22%;width:26px;pointer-events:auto;z-index:4}
.edge.l{left:0}.edge.r{right:0}
.edge::after{content:"";position:absolute;top:50%;height:90px;margin-top:-45px;width:3px;background:linear-gradient(transparent,var(--holo),transparent);opacity:.45;transition:opacity .3s}
.edge.l::after{left:4px}.edge.r::after{right:4px}
.edge:hover::after{opacity:1}
.side{position:fixed;top:50%;width:min(250px,44vw);display:grid;gap:8px;pointer-events:none;z-index:6;opacity:0;transition:transform .5s cubic-bezier(.2,.9,.25,1),opacity .35s ease}
.side.l{left:max(14px,env(safe-area-inset-left,0px));transform:translateY(-50%) perspective(900px) rotateY(62deg) translateX(-70%);transform-origin:0 50%}
.side.r{right:max(14px,env(safe-area-inset-right,0px));transform:translateY(-50%) perspective(900px) rotateY(-62deg) translateX(70%);transform-origin:100% 50%}
.side.open{opacity:1;pointer-events:auto;transform:translateY(-50%) perspective(900px) rotateY(0) translateX(0)}
.side .tile{opacity:0;transition:opacity .4s ease,transform .45s cubic-bezier(.2,1.2,.3,1),border-color .2s,background .2s;transition-delay:calc(var(--i)*70ms);box-shadow:0 0 22px rgba(0,0,0,.45)}
.side.l .tile{transform:translateX(-40px) skewY(4deg)}.side.r .tile{transform:translateX(40px) skewY(-4deg)}
.side.open .tile{opacity:1;transform:none}
.side.open .tile:hover{transform:scale(1.03)}
.side.r .tile{text-align:right;border-top:0;border-right:2px solid var(--line)}
.side.l .tile{border-top:0;border-left:2px solid var(--line)}
.side .tile:hover,.side .tile[aria-pressed="true"]{border-color:var(--holo)}
.side.r .tile small,.side.r .tile b,.side.r .tile span{justify-self:end}
.corner{position:fixed;bottom:calc(14px + env(safe-area-inset-bottom,0px));width:46px;height:46px;display:grid;place-items:center;cursor:pointer;pointer-events:auto;border:0;background:rgba(6,16,32,.78);box-shadow:inset 0 0 0 1px var(--line),0 0 18px rgba(79,216,255,.18);color:var(--holo);border-radius:50%;transition:box-shadow .25s,transform .25s;z-index:5}
.corner:hover,.corner[aria-expanded="true"]{box-shadow:inset 0 0 0 1px var(--holo),0 0 26px rgba(79,216,255,.5);transform:scale(1.06)}
.corner svg{width:22px;height:22px}
.corner.l{left:max(16px,env(safe-area-inset-left,0px))}
.corner.r{right:max(16px,env(safe-area-inset-right,0px))}
.corner i{position:absolute;top:-3px;right:-3px;min-width:18px;height:18px;border-radius:9px;background:var(--ember);color:var(--void);font:600 11px/18px var(--f-display);font-style:normal;text-align:center}
.cfg{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(70px + env(safe-area-inset-bottom,0px));width:min(300px,calc(100vw - 32px));max-height:calc(100% - 160px);overflow:auto;pointer-events:auto;z-index:6;padding:1px;background:linear-gradient(160deg,var(--holo),rgba(27,108,255,.25) 45%,var(--line));clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px);transform-origin:100% 100%;animation:holo .28s ease both}
.cfg>div{background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);padding:16px;display:grid;gap:14px;clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.cfg h2{margin:0;font:600 12px var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:var(--holo)}
.cfg label{display:grid;gap:6px;font:500 11px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim)}
.cfg .sel{max-width:none;width:100%}
.cfg input[type=range]{width:100%;accent-color:var(--holo)}
.cfg .btn{width:100%}
.cfg p{margin:0;font-size:12px;color:var(--ink-dim)}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.keys button{display:grid;gap:4px;justify-items:center;padding:8px 4px;background:var(--glass-2);border:1px solid var(--line);color:var(--ink);font:500 11px var(--f-display);letter-spacing:.08em;text-transform:uppercase;cursor:pointer}
.keys button:hover{border-color:var(--holo);color:var(--holo)}
.keys kbd{font:600 15px var(--f-display);color:var(--holo)}
@keyframes holo{from{opacity:0;transform:perspective(700px) rotateX(-24deg) scale(.9)}to{opacity:1;transform:none}}
.toast{position:fixed;top:calc(74px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%);width:min(440px,calc(100vw - 32px));pointer-events:auto;z-index:7;cursor:pointer;padding:12px 16px;background:rgba(8,20,40,.92);box-shadow:inset 0 0 0 1px var(--ember),0 0 30px rgba(255,181,115,.35);clip-path:polygon(12px 0,100% 0,100% calc(100% - 12px),calc(100% - 12px) 100%,0 100%,0 12px);animation:toast .5s cubic-bezier(.2,1.3,.4,1) both}
.toast small{display:block;font:600 10.5px var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:var(--ember)}
.toast b{display:block;font:500 16px var(--f-display);margin:2px 0}
.toast span{font-size:13px;color:var(--ink-dim)}
@keyframes toast{from{opacity:0;transform:translateX(-50%) translateY(-24px) scaleX(.6)}to{opacity:1;transform:translateX(-50%)}}
.msgs{display:grid;gap:12px;margin:0;padding:0;list-style:none}
.msgs li{display:grid;gap:2px;padding-left:12px;border-left:1px solid var(--line)}
.msgs li.alerta{border-left-color:var(--ember)}
.msgs small{font:500 10.5px var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-dim)}
.msgs b{font:500 15px var(--f-display)}
.msgs span{font-size:13.5px;color:var(--ink-dim)}
.wa-list{display:grid;gap:2px;margin:0;padding:0;list-style:none}
.wa-list button{width:100%;display:grid;grid-template-columns:34px minmax(0,1fr) auto;gap:10px;align-items:center;text-align:left;padding:9px 8px;background:none;border:0;border-bottom:1px solid var(--glass-2);cursor:pointer;color:var(--ink)}
.wa-list button:hover{background:var(--glass-2)}
.wa-av{width:34px;height:34px;display:grid;place-items:center;border:1px solid var(--line);clip-path:polygon(12% 0,88% 0,100% 50%,88% 100%,12% 100%,0 50%);font:600 12px var(--f-display);letter-spacing:.02em;color:var(--holo);background:var(--glass-2)}
.wa-av.g{color:var(--ember)}
.wa-list b{display:block;font:500 14px var(--f-display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wa-list span{display:block;font-size:12.5px;color:var(--ink-dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.wa-meta{display:grid;justify-items:end;gap:4px;white-space:nowrap;font:500 11px var(--f-display);color:var(--ink-dim)}
.wa-meta i{font-style:normal;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--holo);color:var(--void);font:600 11px/18px var(--f-display);text-align:center}
.wa-thread{display:grid;gap:8px}
.wa-back{justify-self:start;background:none;border:1px solid var(--line);color:var(--holo);font:500 11px var(--f-display);letter-spacing:.14em;text-transform:uppercase;padding:5px 10px;cursor:pointer}
.wa-msg{max-width:86%;padding:7px 10px;font-size:13.5px;line-height:1.4;background:var(--glass-2);border-left:2px solid var(--line);justify-self:start;overflow-wrap:anywhere}
.wa-msg.me{justify-self:end;border-left:0;border-right:2px solid var(--holo);background:rgba(79,216,255,.12)}
.wa-msg small{display:block;font:500 10.5px var(--f-display);letter-spacing:.06em;color:var(--ink-dim);margin-bottom:2px}
.wa-tag{font:600 9.5px var(--f-display);letter-spacing:.14em;color:var(--ember);border:1px solid currentColor;padding:0 4px;margin-left:6px;vertical-align:1px}
.vis{position:fixed;top:50%;right:max(70px,6vw);width:min(440px,42vw);transform:translateY(-50%) perspective(900px) rotateY(-24deg) scale(.9);opacity:0;pointer-events:none;z-index:5;transition:opacity .45s ease,transform .55s cubic-bezier(.2,1.1,.3,1)}
.vis.on{opacity:1;transform:translateY(-50%) perspective(900px) rotateY(-7deg);pointer-events:auto}
.vis-in{position:relative;padding:12px;background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 0 0 1px var(--line),0 0 40px rgba(79,216,255,.18);display:grid;gap:10px;clip-path:polygon(14px 0,100% 0,100% calc(100% - 14px),calc(100% - 14px) 100%,0 100%,0 14px)}
.vis-in::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(79,216,255,.05) 3px 4px);pointer-events:none}
.vis h3{margin:0;font:600 12px var(--f-display);letter-spacing:.2em;text-transform:uppercase;color:var(--holo);padding-right:30px}
.vis .x{position:absolute;top:8px;right:8px}
.vis-img{position:relative;aspect-ratio:16/10;overflow:hidden;background:linear-gradient(110deg,var(--glass-2) 30%,rgba(79,216,255,.16) 50%,var(--glass-2) 70%);background-size:220% 100%;animation:shim 1.4s linear infinite}
.vis-img img{width:100%;height:100%;object-fit:cover;display:block;opacity:0;transition:opacity .6s}
.vis-img img.ok{opacity:1}
.vis-img p{position:absolute;inset:auto 0 0 0;margin:0;padding:8px 10px;font:500 11px var(--f-display);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-dim)}
@keyframes shim{to{background-position:-120% 0}}
.flow{display:grid;gap:6px;margin:0;padding:0;list-style:none;counter-reset:f}
.flow li{counter-increment:f;position:relative;display:grid;grid-template-columns:26px minmax(0,1fr);gap:10px;align-items:center;padding:8px 10px;background:var(--glass-2);border-left:2px solid var(--holo);opacity:0;transform:translateX(18px);animation:flowin .5s ease forwards;animation-delay:calc(var(--i)*.35s)}
.flow li::before{content:counter(f);display:grid;place-items:center;width:26px;height:26px;border:1px solid var(--holo);color:var(--holo);font:600 12px var(--f-display)}
.flow li:not(:last-child)::after{content:"";position:absolute;left:22px;bottom:-7px;width:2px;height:8px;background:var(--holo);opacity:.6}
.flow b{font:500 14px var(--f-display);color:var(--ink)}
.flow span{display:block;font-size:12.5px;color:var(--ink-dim)}
@keyframes flowin{to{opacity:1;transform:none}}
@media (max-aspect-ratio:1/1),(max-width:760px){.vis{top:78px;right:50%;width:min(420px,calc(100vw - 32px));transform:translateX(50%) translateY(-12px) scale(.96)}.vis.on{transform:translateX(50%)}}
@media (max-aspect-ratio:1/1),(max-width:760px){
  .zone{align-items:flex-end;justify-content:center;padding-left:0}
  .card{width:min(480px,100%);max-height:100%}
  .news li:first-child .shot{aspect-ratio:21/9}
  .hud{gap:8px}
  .deck{gap:8px}
  .card.out{transform:translateY(14px)}
  .brand b,.clock b{font-size:18px}
  .caption{font-size:14px}
  .tiles{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px;margin-bottom:54px;width:100%}
  .tile{padding:7px 9px}
  .tile span{display:none}
  .controls{gap:6px}
  .tile b{font-size:13px}.tile b.big{font-size:18px}
  .btn{padding:9px 10px;font-size:10.5px;letter-spacing:.08em}
}
@media (max-height:560px){.caption{font-size:13px;padding:4px 10px}.tile span{display:none}.card-in{padding:12px 14px;gap:10px}}
html[data-skin="orbe"]{--void:#000;--ink:#f4f6fb;--ink-dim:#9aa3b5;--holo:#f2f6ff;--holo-deep:#8fa3c8;--ember:#dfe6f5;--ok:#e8eefc;--glass:rgba(12,12,15,.84);--glass-2:rgba(255,255,255,.06);--line:rgba(255,255,255,.26)}
html[data-skin="orbe"] .card,html[data-skin="orbe"] .card-in,html[data-skin="orbe"] .cfg,html[data-skin="orbe"] .cfg>div,html[data-skin="orbe"] .toast,html[data-skin="orbe"] .btn{clip-path:none;border-radius:18px}

html[data-skin="olho"]{--void:#0a0201;--ink:#ffeede;--ink-dim:#d69b7e;--holo:#ff9a3c;--holo-deep:#c2280a;--ember:#ffd28a;--ok:#ffb14a;--glass:rgba(24,7,2,.88);--glass-2:rgba(255,120,40,.09);--line:rgba(255,120,40,.42)}
html[data-skin="olho"] .card,html[data-skin="olho"] .card-in{clip-path:polygon(0 0,calc(100% - 26px) 0,100% 26px,100% 100%,26px 100%,0 calc(100% - 26px))}
html[data-skin="olho"] .card{background:linear-gradient(160deg,#ffb14a,#c2280a 55%,rgba(255,120,40,.3))}
html[data-skin="olho"] .tile{border-top-color:rgba(255,120,40,.5);background:rgba(24,7,2,.88)}
html[data-skin="olho"] .tile:hover,html[data-skin="olho"] .tile[aria-pressed="true"]{background:rgba(60,16,4,.94)}
html[data-skin="neural"]{--void:#05030f;--ink:#f1edff;--ink-dim:#aaa2d8;--holo:#b9a0ff;--holo-deep:#5a3df0;--ember:#6ff0e0;--ok:#6ff0e0;--glass:rgba(13,9,32,.86);--glass-2:rgba(170,140,255,.09);--line:rgba(170,140,255,.38)}
html[data-skin="neural"] .card,html[data-skin="neural"] .card-in,html[data-skin="neural"] .cfg,html[data-skin="neural"] .cfg>div,html[data-skin="neural"] .toast{clip-path:none;border-radius:22px 6px 22px 6px}
html[data-skin="neural"] .card{background:linear-gradient(160deg,#b9a0ff,#5a3df0 50%,#6ff0e0)}

html[data-skin="neural"] .tile:hover,html[data-skin="neural"] .tile[aria-pressed="true"]{border-left-color:var(--holo);background:rgba(30,20,70,.92)}
html[data-skin="lab"]{--void:#04070b;--ink:#eaf7ff;--ink-dim:#93aebb;--holo:#5fe3ff;--holo-deep:#0f8fb8;--ember:#ffc24a;--glass:rgba(6,14,20,.88);--glass-2:rgba(95,227,255,.07);--line:rgba(95,227,255,.34)}
html[data-skin="lab"] .card,html[data-skin="lab"] .card-in{clip-path:polygon(0 0,100% 0,100% calc(100% - 22px),calc(100% - 22px) 100%,0 100%)}
html[data-skin="lab"] .card{background:linear-gradient(160deg,#ffc24a,rgba(95,227,255,.5) 30%,var(--line))}
html[data-skin="lab"] .tile{border-top-color:rgba(255,194,74,.55);background:rgba(6,14,20,.88)}
html[data-skin="lab"] .tile small{color:var(--ember)}
.tile:hover,.tile[aria-pressed="true"]{border-top-color:var(--holo)}
.skin-arrow{position:fixed;top:calc(12px + env(safe-area-inset-top,0px));width:38px;height:44px;display:grid;place-items:center;pointer-events:auto;cursor:pointer;border:0;background:none;color:var(--holo);opacity:.22;transition:opacity .25s,transform .25s;z-index:5}
.skin-arrow:hover,.skin-arrow:focus-visible{opacity:1;transform:scale(1.15)}
.skin-arrow svg{width:14px;height:26px}
.skin-arrow.l{left:calc(50% - 60px)}
.skin-arrow.r{right:calc(50% - 60px)}
.skin-name{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);font:500 clamp(22px,5vw,54px) var(--f-display);letter-spacing:.5em;text-transform:uppercase;color:var(--ink);text-shadow:0 0 30px var(--holo);pointer-events:none;opacity:0;transition:opacity .6s;z-index:4;white-space:nowrap;padding-left:.5em}
.skin-name.on{opacity:.9}
.skinrow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.skinrow b{font:500 13px var(--f-display);letter-spacing:.14em;color:var(--ink);text-transform:uppercase}
.skinrow button{background:none;border:1px solid var(--line);color:var(--holo);width:34px;height:34px;cursor:pointer;font-size:16px}
.skinrow button:hover{border-color:var(--holo)}
@media (prefers-reduced-motion:reduce){.vis,.flow li,.vis-img{transition:none;animation:none;opacity:1;transform:none}.side,.side .tile{transition:none}.card,.tile,.btn,.tiles{transition:none}.cfg,.toast{animation:none}}
</style>

<body>
<canvas id="stage" aria-hidden="true"></canvas>

<div class="hud">
  <header class="top">
    <div class="brand"><b>AION</b><span id="nav">Rota em curso</span></div>
    <div class="clock"><b id="clk">--:--</b><span id="dat"></span><span class="live" id="live">conectando</span></div>
  </header>
  <main class="zone">
    <article class="card out" id="card" hidden aria-live="polite"><div class="card-in" id="cardIn"></div></article>
  </main>
  <footer class="deck">
    <p class="caption" id="cap">AION em espera.</p>
    <div class="controls"><button class="btn" id="mic" type="button">Conversar</button><button id="go" type="button" hidden>Iniciar briefing</button></div>
  </footer>
</div>
<div class="edge l" id="edgeL"></div><div class="edge r" id="edgeR"></div>
<nav class="side l" id="tilesL" aria-label="Painéis pessoais"></nav>
<nav class="side r" id="tilesR" aria-label="Painéis de notícias"></nav>
<button class="corner l" id="dockBtn" type="button" aria-label="Painéis" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3.5" y="3.5" width="7" height="7"/><rect x="13.5" y="3.5" width="7" height="7"/><rect x="3.5" y="13.5" width="7" height="7"/><rect x="13.5" y="13.5" width="7" height="7"/></svg><i id="badge" hidden>0</i></button>
<button class="corner r" id="cfgBtn" type="button" aria-label="Menu do AION" aria-expanded="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M12 2.5l2.1 7.4 7.4 2.1-7.4 2.1L12 21.5l-2.1-7.4L2.5 12l7.4-2.1z"/><circle cx="12" cy="12" r="1.4" fill="currentColor" stroke="none"/></svg></button>
<section class="cfg" id="cfg" hidden aria-label="Ajustes"><div>
  <h2>Menu</h2>
  <label>Volume da voz<input type="range" id="vol" min="0" max="100" value="100"></label>
  <label>Microfone<select class="sel" id="micSel"><option value="">Microfone padrão</option></select></label>
  <label>Voz do AION<button class="btn ghost" id="snd" type="button" aria-pressed="false">Voz econômica</button></label>
  <label>Skin<span class="skinrow"><button type="button" id="skinPrev2" aria-label="Skin anterior">‹</button><b id="skinLbl">Nave</b><button type="button" id="skinNext2" aria-label="Próxima skin">›</button></span></label>
  <label>WhatsApp<span id="waSt" style="font:500 13px var(--f-body);letter-spacing:0;text-transform:none;color:var(--ink)">verificando…</span><img id="waQr" alt="QR code do WhatsApp" hidden style="width:100%;border-radius:10px;background:#fff"></label>
  <label>Comandos<span class="keys"><button type="button" data-k="1"><kbd>1</kbd>Conversar</button><button type="button" data-k="0"><kbd>0</kbd>Pausar</button><button type="button" data-k="b"><kbd>B</kbd>Briefing</button></span></label>
  <p>Espaço interrompe a fala. Setas ← → trocam a skin. Esc fecha.</p>
</div></section>
<div class="toast" id="toast" hidden></div>
<aside class="vis" id="vis" aria-live="polite"><div class="vis-in" id="visIn"></div></aside>
<button class="skin-arrow l" id="skinPrev" type="button" aria-label="Skin anterior"><svg viewBox="0 0 22 40" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M16 4L5 20l11 16"/></svg></button>
<button class="skin-arrow r" id="skinNext" type="button" aria-label="Próxima skin"><svg viewBox="0 0 22 40" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 4l11 16L6 36"/></svg></button>
<div class="skin-name" id="skinName" aria-hidden="true"></div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script src="/vendor/elevenlabs-client.js" defer></script>

<script>
/* ---------- estado compartilhado entre o HUD e a cena ---------- */
const S = { speaking:false, listening:false, cardOpen:false, nav:'', level:-1, skin:'nave' };
const REDUCE = matchMedia('(prefers-reduced-motion: reduce)').matches;

/* ================= HUD, dados e voz ================= */
(function(){
  const $ = id => document.getElementById(id);
  const cap = $('cap'), card = $('card'), cardIn = $('cardIn'), sides = {l: $('tilesL'), r: $('tilesR')}, go = $('go'), mic = $('mic'), snd = $('snd'), live = $('live'), dockBtn = $('dockBtn'), cfgBtn = $('cfgBtn'), cfg = $('cfg'), vol = $('vol'), toast = $('toast'), badge = $('badge');
  const TOUCH = matchMedia('(pointer: coarse)').matches;

  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const brl = n => Number(n).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
  const num = n => Number(n).toLocaleString('pt-BR');
  const store = { get(k){ try { return localStorage.getItem(k); } catch(e){ return null; } }, set(k,v){ try { localStorage.setItem(k,v); } catch(e){} } };

  function tick(){
    const d = new Date();
    $('clk').textContent = d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
    $('dat').textContent = d.toLocaleDateString('pt-BR',{weekday:'short',day:'2-digit',month:'short'}).replace(/\./g,'');
    if (S.nav) $('nav').innerHTML = S.nav;
  }
  tick(); setInterval(tick, 1000);

  const ICON = {
    sol:'<svg viewBox="0 0 24 24" fill="none" stroke="#ffb573" stroke-width="1.6" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/></svg>',
    nuvem:'<svg viewBox="0 0 24 24" fill="none" stroke="#93b3cc" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18h10a4 4 0 0 0 .5-7.97A5.5 5.5 0 0 0 7 9.5 4.25 4.25 0 0 0 7 18z"/></svg>',
    chuva:'<svg viewBox="0 0 24 24" fill="none" stroke="#4fd8ff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 15h10a4 4 0 0 0 .5-7.97A5.5 5.5 0 0 0 7 6.5 4.25 4.25 0 0 0 7 15z"/><path d="M9 18l-1 2.5M13 18l-1 2.5M17 18l-1 2.5"/></svg>',
    tempestade:'<svg viewBox="0 0 24 24" fill="none" stroke="#ffb573" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 14h10a4 4 0 0 0 .5-7.97A5.5 5.5 0 0 0 7 5.5 4.25 4.25 0 0 0 7 14z" stroke="#93b3cc"/><path d="M12 15l-2 3.5h3L11.5 22"/></svg>'
  };
  const SECTIONS = [
    {id:'clima', label:'Clima'}, {id:'velt', label:'Anúncios VELT'}, {id:'ia', label:'Universo das IAs'},
    {id:'mkt', label:'Marketing'}, {id:'studio', label:'Estúdio'}, {id:'sep', label:'Palmeiras'}, {id:'avisos', label:'Avisos'}, {id:'whats', label:'WhatsApp'}
  ];
  let inbox = [], pending = 0, lastInbox = +(store.get('aion-inbox') || 0), seenInbox = +(store.get('aion-inbox-seen') || 0), lastMem = [], autoCard = false, quiet = 0, volume = Math.min(1, Math.max(0, (+(store.get('aion-vol') || 100)) / 100));
  let D = null, V = null, wxCity = 0, current = null;

  function ago(iso){
    if (!iso) return '';
    const m = Math.max(1, Math.round((Date.now() - Date.parse(iso)) / 6e4));
    return m < 60 ? 'há ' + m + ' min' : m < 1440 ? 'há ' + Math.round(m/60) + ' h' : 'há ' + Math.round(m/1440) + ' d';
  }
  const dayName = iso => ['dom','seg','ter','qua','qui','sex','sáb'][new Date(iso + 'T12:00:00').getDay()];

  /* ----- painéis do rodapé ----- */
  function tileHTML(id){
    if (!D) return ['…','carregando'];
    if (id === 'clima'){ const w = D.weather; if (!w) return ['—','sem dados agora']; return [w[0].temp + '°', w.slice(1).map(c => c.city.replace('São Bernardo','SBC') + ' ' + c.temp + '°').join(' · '), true]; }
    if (id === 'velt'){ if (!V || V.locked) return ['Bloqueado','toque para liberar']; if (V.empty) return ['—','sem dados']; return [brl(V.yesterday.spend), 'ontem · ' + num(V.yesterday.linkClicks) + ' cliques', true]; }
    if (id === 'studio') return [D.studio.title, 'cadeia do dia'];
    if (id === 'whats'){ if (!waChats) return ['…', 'conversas']; const un = waChats.reduce((n, c) => n + (c.unread || 0), 0); const c = waChats[0]; return [c ? c.name : 'Sem conversas', un ? un + ' não lida(s)' : c ? waLast(c) : 'aguardando a ponte']; }
    if (id === 'avisos') return [inbox.length ? inbox[0].title : 'Nada por enquanto', pending ? pending + ' tarefa(s) em andamento' : 'tarefas e alertas'];
    const list = D[id === 'ia' ? 'ai' : id] || []; if (!list.length) return ['Sem notícias agora','tente em instantes'];
    return [list[0].title, list[0].source + ' · ' + ago(list[0].date)];
  }
  function renderTiles(){
    const unseen = inbox.filter(i => i.id > seenInbox).length; badge.hidden = !unseen; badge.textContent = unseen;
    const SIDE = {clima: 'l', velt: 'l', avisos: 'l', whats: 'l'};
    for (const k of ['l', 'r']) sides[k].innerHTML = SECTIONS.filter(x => (SIDE[x.id] || 'r') === k).map((x, i) => { const t = tileHTML(x.id);
      return '<button class="tile" type="button" style="--i:' + i + '" data-id="' + x.id + '" aria-pressed="' + (current === x.id) + '"><small>' + x.label + '</small><b class="' + (t[2] ? 'big' : '') + '">' + esc(t[0]) + '</b><span>' + esc(t[1]) + '</span></button>'; }).join('');
  }
  for (const k of ['l', 'r']) sides[k].addEventListener('click', e => { const b = e.target.closest('.tile'); if (b) openSection(b.dataset.id, true); });

  /* ----- cartões de detalhe ----- */
  const head = t => '<div class="card-head"><h2>' + t + '</h2><button class="x" type="button" data-close aria-label="Fechar">×</button></div>';
  function newsHTML(list){
    if (!list || !list.length) return '<p>Nenhuma notícia chegou dos veículos agora. Tente de novo em alguns minutos.</p>';
    return '<ul class="news">' + list.map((n, i) => '<li><a href="' + esc(n.link) + '" target="_blank" rel="noopener noreferrer">'
      + '<div class="shot' + (n.image ? '' : ' noimg') + '" data-src="' + esc(n.source) + '">' + (n.image ? '<img alt="" loading="lazy" referrerpolicy="no-referrer" src="' + esc(n.image) + '">' : '') + '</div>'
      + '<div><b>' + esc(n.title) + '</b>' + (i === 0 && n.summary ? '<span>' + esc(n.summary) + '</span>' : '') + '<span><em>' + esc(n.source) + '</em> · ' + ago(n.date) + (n.lang === 'en' ? ' · em inglês' : '') + '</span></div></a></li>').join('') + '</ul>';
  }
  const CARD = {
    clima(){
      const w = D.weather; if (!w) return head('Clima') + '<p>O serviço de clima não respondeu agora.</p>';
      const c = w[wxCity];
      return head('Clima') + '<div class="cities">' + w.map((x, i) => '<button class="city" type="button" data-city="' + i + '" aria-pressed="' + (i === wxCity) + '"><small>' + esc(x.city) + '</small><b>' + x.temp + '°' + ICON[x.icon] + '</b><span>' + x.min + '° / ' + x.max + '°</span><span>chuva ' + x.rain + '%</span></button>').join('') + '</div>'
        + '<div class="week">' + c.week.map((d, i) => '<div>' + (i ? dayName(d.date) : 'hoje') + ICON[d.icon] + '<b>' + d.max + '°</b>' + d.min + '°<i>' + d.rain + '%</i></div>').join('') + '</div>'
        + '<p>Semana em ' + esc(c.city) + '. Toque em outra cidade para trocar.</p>';
    },
    velt(){
      if (!V || V.locked) return head('Anúncios VELT') + '<div class="lock"><p>Os números dos anúncios e a conversa por voz ficam protegidos. Digite o código de acesso uma vez neste aparelho.</p><form id="lockForm"><input id="lockIn" type="password" inputmode="numeric" autocomplete="off" aria-label="Código de acesso" placeholder="••••••"><button class="btn" type="submit">Liberar</button></form><p id="lockMsg"></p></div>';
      if (V.empty) return head('Anúncios VELT') + '<p>Ainda não há números salvos.</p>';
      const y = V.yesterday;
      return head('Anúncios VELT') + '<div class="stats">'
        + '<div class="stat"><small>Investido ontem</small><b>' + brl(y.spend) + '</b></div>'
        + '<div class="stat"><small>Alcance</small><b>' + num(y.reach) + '</b></div>'
        + '<div class="stat"><small>Cliques no link</small><b>' + num(y.linkClicks) + '</b></div>'
        + '<div class="stat"><small>Custo por clique</small><b>' + brl(y.cpc) + '</b></div></div>'
        + '<div class="days">' + V.days.map(d => '<div>' + dayName(d.date) + '<b>' + (d.spend ? 'R$ ' + Math.round(d.spend) : '—') + '</b></div>').join('') + '</div>'
        + '<p class="note">Na semana: <b>' + brl(V.week.spend) + '</b> investidos, <b>' + num(V.week.impressions) + '</b> impressões e <b>' + num(V.week.linkClicks) + '</b> cliques no link.</p>'
        + '<p class="note">Melhor anúncio: <b>' + esc(V.top.name) + '</b>, ' + esc(V.top.metric) + ' a <b>' + brl(V.top.cost) + '</b>.</p>'
        + '<p>Dados até ' + new Date(V.asOf + 'T12:00:00').toLocaleDateString('pt-BR') + '.</p>';
    },
    ia(){ return head('Universo das IAs') + newsHTML(D.ai); },
    mkt(){ return head('Marketing e nichos') + '<ul class="rows"><li><b>Nicho do dia</b><span>' + esc(D.radar.niche) + '</span></li><li><b>Ideia de sistema</b><span>' + esc(D.radar.idea) + '</span></li><li><b>Por que agora</b><span>' + esc(D.radar.why) + '</span></li></ul>' + newsHTML(D.mkt); },
    studio(){ const s = D.studio; return head('Estúdio') + '<h3>' + esc(s.title) + '</h3><p>' + esc(s.why) + '</p><ol class="chain">' + s.chain.map(c => '<li><div><b>' + esc(c[0]) + '</b><span>' + esc(c[1]) + '</span></div></li>').join('') + '</ol>'; },
    sep(){ return head('Palmeiras') + newsHTML(D.sep); },
    whats(){

    const core = new THREE.Sprite(new THREE.SpriteMaterial({map: glowTex([[0,'rgba(255,255,255,.95)'],[.1,'rgba(190,170,255,.7)'],[.4,'rgba(90,60,240,.22)'],[1,'rgba(0,0,0,0)']]), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true}));
    g.add(core);
    return {scene: sc, camera: cm, resize(){ cm.aspect = aspect; cm.fov = land ? 50 : 72; cm.updateProjectionMatrix(); },
      update(dt){ U.uTime.value = T; U.uAmp.value = amp; g.rotation.y += dt*(.05 + amp*.12); g.rotation.x += ((my*.25) - g.rotation.x)*Math.min(1, dt*2);
        g.position.x += ((S.cardOpen && land ? 2.0 : 0) - g.position.x)*Math.min(1, dt*2.5); g.position.y = land ? .25 : 1.3;
        core.scale.setScalar(1.4 + amp*1.6 + (S.listening ? .25*Math.sin(T*2.4) : 0)); }};
  }
  function buildLab(){
    const sc = new THREE.Scene(), cm = new THREE.PerspectiveCamera(50, aspect, .1, 200); sc.fog = new THREE.Fog(0x04070b, 9, 26);
    const cy = new THREE.MeshBasicMaterial({color: 0x5fe3ff}), cyD = new THREE.MeshBasicMaterial({color: 0x176a86}), am = new THREE.MeshBasicMaterial({color: 0xffc24a});
    const metal = new THREE.MeshPhongMaterial({color: 0x0b1118, specular: 0x4a6a80, shininess: 50, envMap: cubeA.texture, reflectivity: .18, combine: THREE.AddOperation});
    const add = (geo, mat, x, y, z) => { const m = new THREE.Mesh(geo, mat); m.position.set(x||0, y||0, z||0); sc.add(m); return m; };
    sc.add(new THREE.AmbientLight(0x22384a, .9)); const pl = new THREE.PointLight(0x5fe3ff, 1.4, 16, 2); pl.position.set(0, 2.2, 0); sc.add(pl);
    const wl = new THREE.PointLight(0xffc24a, .7, 14, 2); wl.position.set(-5, 3, 2); sc.add(wl);
    // piso em malha hexagonal com brilho do projetor
    const FU = {uAmp: {value: 0}};
    const fl = add(new THREE.CircleGeometry(22, 64), new THREE.ShaderMaterial({uniforms: FU, extensions: {derivatives: true},
      vertexShader: `varying vec3 vW; void main(){ vec4 w=modelMatrix*vec4(position,1.); vW=w.xyz; gl_Position=projectionMatrix*viewMatrix*w; }`,
      fragmentShader: `uniform float uAmp; varying vec3 vW;
        float hexd(vec2 p){ p=abs(p); return max(dot(p,vec2(.5,.866)),p.x); }
        void main(){ vec2 p=vW.xz*1.15; vec2 r=vec2(1.,1.732), h=r*.5; vec2 a=mod(p,r)-h, b=mod(p-h,r)-h; vec2 g=dot(a,a)<dot(b,b)?a:b;
          float ed=.5-hexd(g); float ln=1.-smoothstep(0.,fwidth(ed)*1.5+.012,ed);
          float d=length(vW.xz); float fade=exp(-d*.16);
          vec3 col=vec3(.012,.018,.026)+vec3(.12,.55,.75)*ln*.22*fade+vec3(.10,.55,.80)*exp(-d*d*.35)*(.30+uAmp*.5);
          col+=vec3(1.,.72,.25)*(1.-smoothstep(0.,.03,abs(d-2.6)))*.35;
          gl_FragColor=vec4(col,1.); }`}), 0, 0, 0); fl.rotation.x = -Math.PI/2;
    // parede do fundo, colunas de luz, racks
    add(new THREE.BoxGeometry(30, 9, .3), metal, 0, 4.5, -8);
    for (let i = -5; i <= 5; i++){ if (!i) continue; add(new THREE.BoxGeometry(.05, 5.5 + (i%2)*1.2, .05), i % 3 ? cyD : cy, i*1.9, 3.4, -7.8); }
    add(new THREE.BoxGeometry(26, .05, .05), am, 0, 6.6, -7.8); add(new THREE.BoxGeometry(26, .03, .05), cyD, 0, .5, -7.8);
    const rackTex = uiTex(512, 1024, 91, true); rackTex.wrapT = THREE.RepeatWrapping;
    [-1, 1].forEach(sx => { const rk = add(new THREE.BoxGeometry(2.6, 5.4, 1.2), metal, sx*9.2, 2.7, -5.2); rk.rotation.y = -sx*.5;
      const scr = add(new THREE.PlaneGeometry(2.2, 4.8), new THREE.MeshBasicMaterial({map: rackTex, transparent: true, blending: THREE.AdditiveBlending, opacity: .55}), sx*8.9, 2.7, -4.52); scr.rotation.y = -sx*.5; });
    // bancadas e braço robótico
    [-1, 1].forEach(sx => { add(new THREE.BoxGeometry(3.6, .12, 1.5), metal, sx*5.4, 1.0, 1.6).rotation.y = sx*.35; add(new THREE.BoxGeometry(3.6, .025, .04), sx < 0 ? am : cy, sx*5.05, 1.07, 2.25).rotation.y = sx*.35;
      add(new THREE.BoxGeometry(.14, 1, .14), metal, sx*4.2, .5, 1.3); add(new THREE.BoxGeometry(.14, 1, .14), metal, sx*6.6, .5, 1.9); });
    const armG = new THREE.Group(); armG.position.set(5.3, 1.06, 1.5); sc.add(armG);
    const seg = (len, r, par, y, rz) => { const j = new THREE.Group(); j.position.y = y; j.rotation.z = rz; par.add(j); const m = new THREE.Mesh(new THREE.CylinderGeometry(r*.8, r, len, 14), metal); m.position.y = len/2; j.add(m); const k = new THREE.Mesh(new THREE.SphereGeometry(r*1.25, 16, 12), metal); j.add(k); const rg = new THREE.Mesh(new THREE.TorusGeometry(r*1.3, .012, 6, 24), am); rg.rotation.y = Math.PI/2; j.add(rg); return j; };
    const a1 = seg(1.1, .1, armG, 0, .45), a2 = seg(.95, .08, a1, 1.1, -1.25), a3 = seg(.45, .06, a2, .95, -.7);
    add(new THREE.SphereGeometry(.03, 8, 8), cy, 0, 0, 0).position.set(0, 0, 0);
    // pedestal e holograma
    add(new THREE.CylinderGeometry(1.25, 1.4, .22, 48), metal, 0, .11, 0);
    add(new THREE.TorusGeometry(1.1, .018, 8, 80), cy, 0, .235, 0).rotation.x = Math.PI/2;
    add(new THREE.TorusGeometry(.62, .01, 8, 60), am, 0, .235, 0).rotation.x = Math.PI/2;
    const holo = new THREE.Group(); holo.position.set(0, 2.25, 0); sc.add(holo);
    const lineM = c => new THREE.LineBasicMaterial({color: c, transparent: true, blending: THREE.AdditiveBlending, depthWrite: false});
    const w1 = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.IcosahedronGeometry(.95, 1)), lineM(0x5fe3ff)); holo.add(w1);
    const w2 = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.OctahedronGeometry(.5, 0)), lineM(0xffc24a)); holo.add(w2);
    const w3 = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.IcosahedronGeometry(1.35, 0)), lineM(0x1d7fa0)); holo.add(w3);
    const hrings = [[1.6,.5,.2],[1.85,-.9,.6],[2.1,1.3,-.3]].map(c => { const t = new THREE.Mesh(new THREE.TorusGeometry(c[0], .006, 6, 120), cy); t.rotation.set(c[1], c[2], 0); holo.add(t); return t; });
    const hcore = new THREE.Sprite(new THREE.SpriteMaterial({map: glowTex([[0,'rgba(255,255,255,.95)'],[.12,'rgba(150,235,255,.7)'],[.45,'rgba(30,140,200,.2)'],[1,'rgba(0,0,0,0)']]), blending: THREE.AdditiveBlending, depthWrite: false, transparent: true})); holo.add(hcore);
    const beamM = new THREE.ShaderMaterial({side: THREE.DoubleSide, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, uniforms: {uTime: {value: 0}, uAmp: {value: 0}},
      vertexShader: `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.); }`,
      fragmentShader: `uniform float uTime,uAmp; varying vec2 vUv; void main(){ float a=pow(1.-vUv.y,1.4)*(.6+.4*sin(vUv.y*60.-uTime*4.)); gl_FragColor=vec4(vec3(.2,.75,1.)*a*(.16+uAmp*.2),1.); }`});
    add(new THREE.CylinderGeometry(1.5, 1.05, 2.4, 48, 1, true), beamM, 0, 1.43, 0);
    // telas flutuantes
    const screens = [-62, -34, 34, 62].map((deg, i) => { const a = deg*Math.PI/180, tx = uiTex(1024, 512, 120 + i*7, false);
      const m = add(new THREE.PlaneGeometry(2.3, 1.25), new THREE.MeshBasicMaterial({map: tx, transparent: true, blending: THREE.AdditiveBlending, opacity: .8, side: THREE.DoubleSide}), Math.sin(a)*4.3, 2.3 + (i%2)*.5, -Math.cos(a)*4.3 + 1.2);
      m.rotation.y = -a*.75; const fr = new THREE.LineSegments(new THREE.EdgesGeometry(new THREE.PlaneGeometry(2.4, 1.35)), lineM(i % 2 ? 0xffc24a : 0x5fe3ff)); m.add(fr); m.userData = {y: m.position.y, tx, ph: i*1.7}; return m; });
    // partículas subindo no feixe
    const pn = small ? 140 : 320, pa = new Float32Array(pn*3); const r3 = rng(5); for (let i = 0; i < pn; i++){ const a = r3()*6.2832, rr = .2 + r3()*1.2; pa.set([Math.cos(a)*rr, r3()*3.4, Math.sin(a)*rr], i*3); }
    const pgeo = new THREE.BufferGeometry(); pgeo.setAttribute('position', new THREE.BufferAttribute(pa, 3));
    const PU = {uTime: {value: 0}, uAmp: {value: 0}, uPx: {value: DPR}};
    const prt = new THREE.Points(pgeo, new THREE.ShaderMaterial({uniforms: PU, transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
      vertexShader: `uniform float uTime,uAmp,uPx; varying float vA; void main(){ vec3 p=position; p.y=.25+mod(position.y+uTime*(.35+uAmp*.8),3.4); vA=smoothstep(3.6,1.5,p.y)*smoothstep(.2,.6,p.y); vec4 mv=modelViewMatrix*vec4(p,1.); gl_PointSize=uPx*2.2*(6./-mv.z); gl_Position=projectionMatrix*mv; }`,
      fragmentShader: `varying float vA; void main(){ float d=length(gl_PointCoord-.5); gl_FragColor=vec4(vec3(.5,.9,1.)*smoothstep(.5,0.,d)*vA*.9,1.); }`}));
    prt.frustumCulled = false; sc.add(prt);
    const cp = new V3(), lk = new V3(0, 2.0, 0);
    return {scene: sc, camera: cm, resize(){ cm.aspect = aspect; cm.fov = land ? 50 : 76; cm.updateProjectionMatrix(); },
      update(dt){ const sh = S.cardOpen && land ? -1.5 : 0;
        cp.set(mx*.5 + sh, 2.0 - my*.25, land ? 8.2 : 9.5); cm.position.lerp(cp, Math.min(1, dt*2)); lk.x += (sh*.7 - lk.x)*Math.min(1, dt*2); lk.y = land ? 2.0 : 1.2; cm.lookAt(lk);
        FU.uAmp.value = amp; beamM.uniforms.uTime.value = T; beamM.uniforms.uAmp.value = amp; PU.uTime.value = T; PU.uAmp.value = amp;
        w1.rotation.y += dt*(.25 + amp); w1.rotation.x += dt*.1; w2.rotation.y -= dt*(.6 + amp*2); w2.rotation.z += dt*.3; w3.rotation.y -= dt*.08;
        holo.scale.setScalar(1 + amp*.12); holo.position.y = 2.25 + Math.sin(T*.9)*.05; hcore.scale.setScalar(.6 + amp*.9 + (S.listening ? .15*Math.sin(T*2.5) : 0));
        hrings.forEach((r, i) => { r.rotation.z += dt*(.2 + i*.12)*(i % 2 ? -1 : 1)*(1 + amp*2); });
        screens.forEach(m => { m.position.y = m.userData.y + Math.sin(T*.6 + m.userData.ph)*.06; m.userData.tx.offset.x = T*.01*(m.userData.ph % 2 ? 1 : -1); m.material.opacity = .6 + amp*.3 + .1*Math.sin(T*1.3 + m.userData.ph); });
        a1.rotation.z = .45 + Math.sin(T*.4)*.08; a2.rotation.z = -1.25 + Math.sin(T*.55 + 1)*.12 - amp*.2; a3.rotation.z = -.7 + Math.sin(T*.9)*.2;
        pl.intensity = 1.2 + amp*1.4; }};
  }
  SK = [
    {id: 'nave', name: 'Nave', built: true, scene, camera, update: shipUpdate},
    {id: 'orbe', name: 'Orbe', tag: 'Orbe · presença mínima', build: buildOrbe},
    {id: 'olho', name: 'Olho', tag: 'Olho · vigília', build: buildOlho},
    {id: 'neural', name: 'Núcleo neural', tag: 'Núcleo neural · sinapses ativas', build: buildNeural},
    {id: 'lab', name: 'Laboratório', tag: 'Laboratório · bancada de protótipos', build: buildLab}
  ];
  function setSkin(i, announce){
    cur = (i % SK.length + SK.length) % SK.length; const k = SK[cur];
    if (!k.built){ Object.assign(k, k.build()); k.built = true; }
    if (k.resize) k.resize();
    if (rp){ rp.scene = k.scene; rp.camera = k.camera; }
    document.documentElement.dataset.skin = k.id; S.skin = k.id; if (k.tag) S.nav = k.tag;
    try { localStorage.setItem('aion-skin', k.id); } catch(e){}
    dispatchEvent(new CustomEvent('aion-skin', {detail: {id: k.id, name: k.name, announce: !!announce}}));
  }
  window.AION_skin = d => setSkin(cur + d, true);
  window.AION_setSkin = id => { const i = SK.findIndex(k => k.id === id); if (i >= 0) setSkin(i, false); };
  let saved = 'nave'; try { saved = localStorage.getItem('aion-skin') || 'nave'; } catch(e){}
  window.AION_setSkin(saved);

  function frame(now){
    const dt = Math.min(.05, (now-last)/1000); last = now; T += dt;
    timeU.value = T; starsMat.uniforms.uTime.value = T; dustU.uTime.value = REDUCE ? 0 : T;
    if (grade) grade.uniforms.uTime.value = T;
    const tgt = !S.speaking ? 0 : S.level >= 0 ? .15 + .85*S.level : .3 + .7*Math.pow(Math.abs(Math.sin(T*7.3)*Math.sin(T*3.1+1.3)), .6);
    amp += (tgt-amp)*Math.min(1, dt*10);
    SK[cur].update(dt);
    if (composer) composer.render(); else renderer.render(SK[cur].scene, SK[cur].camera);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
